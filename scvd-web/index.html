<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; font-family: 'Josefin Sans', sans-serif; }

  .hero-banner {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 11;
    min-height: 380px;
    overflow: hidden;
  }
  .hero-banner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 78%;
    display: block;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 56px 48px 0;
    background: linear-gradient(to bottom, rgba(13,13,13,0.85) 0%, rgba(13,13,13,0.45) 35%, rgba(13,13,13,0) 65%);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .masthead { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 88px; color: #f5f3ee; line-height: 1; }
  .masthead .dot { color: #C9A84C; }
  .hero-meta { text-align: right; }
  .hero-tagline { font-size: 14px; color: rgba(245,243,238,0.75); margin-bottom: 4px; }
  .hero-sub { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9A84C; }

  @media (max-width: 720px) {
    .hero-banner { aspect-ratio: 3 / 4; }
    .hero-overlay { padding: 32px 20px 0; flex-direction: column; gap: 16px; }
    .hero-meta { text-align: left; }
    .masthead { font-size: 56px; }
  }
</style>
</head>
