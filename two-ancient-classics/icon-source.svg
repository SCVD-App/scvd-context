<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152229"/>
      <stop offset="100%" stop-color="#0a1216"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4dd96"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Two classical columns, spaced and proportioned to read clearly as
       Roman numeral II at any size, down to a 16px favicon. Deliberately
       simple silhouettes (capital, fluted shaft, base) rather than
       ornamental detail, since detail is exactly what disappears first at
       small sizes. -->
  <g fill="url(#gold)">
    <!-- Left pillar -->
    <g transform="translate(148,0)">
      <rect x="-46" y="120" width="92" height="26" rx="4"/>
      <rect x="-36" y="146" width="72" height="14"/>
      <rect x="-30" y="160" width="60" height="192"/>
      <line x1="-16" y1="168" x2="-16" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <line x1="0" y1="168" x2="0" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <line x1="16" y1="168" x2="16" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <rect x="-36" y="352" width="72" height="14"/>
      <rect x="-46" y="366" width="92" height="26" rx="4"/>
    </g>
    <!-- Right pillar -->
    <g transform="translate(364,0)">
      <rect x="-46" y="120" width="92" height="26" rx="4"/>
      <rect x="-36" y="146" width="72" height="14"/>
      <rect x="-30" y="160" width="60" height="192"/>
      <line x1="-16" y1="168" x2="-16" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <line x1="0" y1="168" x2="0" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <line x1="16" y1="168" x2="16" y2="344" stroke="#0a1216" stroke-width="5" opacity="0.35"/>
      <rect x="-36" y="352" width="72" height="14"/>
      <rect x="-46" y="366" width="92" height="26" rx="4"/>
    </g>
  </g>
</svg>
