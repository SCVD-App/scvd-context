// ---------- Board geometry ----------
// Classic 24-point board: three concentric squares (outer/middle/inner),
// each contributing 8 points (4 corners + 4 side-midpoints), joined by 4
// "spoke" lines running from each outer midpoint through the corresponding
// middle and inner midpoints. Laid out on a 0-6 grid, same rendering
// approach as Jumpin' Pin/Ur's PAD+CELL sizing.
const POINTS = [
  // outer ring, indices 0-7
  { x: 0, y: 0 }, { x: 3, y: 0 }, { x: 6, y: 0 },
  { x: 6, y: 3 }, { x: 6, y: 6 }, { x: 3, y: 6 },
  { x: 0, y: 6 }, { x: 0, y: 3 },
  // middle ring, indices 8-15
  { x: 1, y: 1 }, { x: 3, y: 1 }, { x: 5, y: 1 },
  { x: 5, y: 3 }, { x: 5, y: 5 }, { x: 3, y: 5 },
  { x: 1, y: 5 }, { x: 1, y: 3 },
  // inner ring, indices 16-23
  { x: 2, y: 2 }, { x: 3, y: 2 }, { x: 4, y: 2 },
  { x: 4, y: 3 }, { x: 4, y: 4 }, { x: 3, y: 4 },
  { x: 2, y: 4 }, { x: 2, y: 3 },
];

// The 16 possible mill-lines (straight runs of 3 points).
const MILLS = [
  // outer ring sides
  [0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0],
  // middle ring sides
  [8, 9, 10], [10, 11, 12], [12, 13, 14], [14, 15, 8],
  // inner ring sides
  [16, 17, 18], [18, 19, 20], [20, 21, 22], [22, 23, 16],
  // the four spokes connecting the rings
  [1, 9, 17], [3, 11, 19], [5, 13, 21], [7, 15, 23],
];

// Adjacency graph and per-point mill membership, both derived from MILLS —
// each mill [a,b,c] contributes edges a-b and b-c (b being the point
// physically between a and c on that line).
const ADJACENCY = Array.from({ length: 24 }, () => new Set());
const POINT_MILLS = Array.from({ length: 24 }, () => []);
const EDGES = [];
MILLS.forEach((mill) => {
  const [a, b, c] = mill;
  ADJACENCY[a].add(b); ADJACENCY[b].add(a);
  ADJACENCY[b].add(c); ADJACENCY[c].add(b);
  EDGES.push([a, b], [b, c]);
  mill.forEach((idx) => POINT_MILLS[idx].push(mill));
});

function millComplete(points, side, mill) {
  return mill.every((idx) => points[idx] === side);
}
function pointsInMills(points, side) {
  const inMill = new Set();
  MILLS.forEach((mill) => { if (millComplete(points, side, mill)) mill.forEach((i) => inMill.add(i)); });
  return inMill;
}
function legalDestinations(points, side, fromIdx, flying) {
  if (flying) return points.map((v, i) => v === null ? i : null).filter((i) => i !== null);
  return [...ADJACENCY[fromIdx]].filter((i) => points[i] === null);
}
function sideCanMove(points, side, flying) {
  for (let i = 0; i < 24; i++) {
    if (points[i] !== side) continue;
    if (legalDestinations(points, side, i, flying).length > 0) return true;
  }
  return false;
}

// ---------- Nine Men's Morris rule variants ----------
// Three genuinely documented variants:
//   Standard — 9 pieces, phased (place all, then move), flying enabled
//     once reduced to 3 on board. This is the convention most digital
//     implementations default to.
//   Classic — identical to Standard but flying disabled entirely, which
//     several written rule sets treat as the "purist" version, explicitly
//     calling flying an optional addition for newer/younger players.
//   Lasker — proposed by chess grandmaster Emanuel Lasker: no separate
//     placement/movement phases at all. Every turn, if you still have
//     pieces in hand, you freely choose to EITHER place a new one OR move
//     one already on the board. Traditionally played with 10 pieces per
//     side rather than 9.
// One explicit assumption, not found addressed directly in the sources
// checked: whether Lasker's hybrid turns still get flying at 3-remaining.
// Kept enabled here, same as Standard — it's the lower-risk default and
// most modern write-ups treat flying as a near-universal convention
// regardless of phase structure. Flagged rather than silently assumed.
const NMM_VARIANTS = {
  standard: { key: "standard", name: "Standard", subtitle: "9 pieces · flying enabled", pieceCount: 9, flyingEnabled: true, laskerHybrid: false },
  classic: { key: "classic", name: "Classic", subtitle: "9 pieces · no flying", pieceCount: 9, flyingEnabled: false, laskerHybrid: false },
  lasker: { key: "lasker", name: "Lasker", subtitle: "10 pieces · place or move any turn", pieceCount: 10, flyingEnabled: true, laskerHybrid: true },
};
const NMM_DEFAULT_VARIANT_KEY = "standard";

function nmmOpponent(side) { return side === "you" ? "cpu" : "you"; }

// NOTE on the "multiple mills" scholarly variant: some rule sets award TWO
// removals if a single placement/move completes two mill-lines at once
// (rare, but geometrically possible at a few shared points). Deliberately
// not implemented — every composite move here removes at most one piece
// even if POINT_MILLS[destIdx] contains more than one completed mill. That
// keeps the removal UI a single click rather than a multi-step sequence,
// and single-removal is the more commonly assumed default in the sources
// checked (the double-removal behaviour was explicitly framed as "a
// variation", not the baseline). Flagged, not silently dropped.

// Generates every legal composite move for `side`: a primary action
// (place or move) optionally followed by a forced opponent-piece removal
// if that action completes a mill. This is the single source of truth the
// AI searches over — the UI's own click-driven handlePointClick is written
// separately for responsiveness, but both are checked against the same
// legalDestinations/millComplete/pointsInMills primitives so they can't
// disagree about what's legal.
function nmmGenerateMoves(points, side, hand, variant, inPlacementPhase) {
  const flying = variant.flyingEnabled && !inPlacementPhase && points.filter((p) => p === side).length === 3;
  const canPlace = variant.laskerHybrid ? hand > 0 : (inPlacementPhase && hand > 0);
  const canMove = variant.laskerHybrid ? true : !inPlacementPhase;

  const primaries = [];
  if (canPlace) {
    for (let i = 0; i < 24; i++) if (points[i] === null) primaries.push({ type: "place", to: i });
  }
  if (canMove) {
    for (let i = 0; i < 24; i++) {
      if (points[i] !== side) continue;
      for (const dest of legalDestinations(points, side, i, flying)) primaries.push({ type: "move", from: i, to: dest });
    }
  }

  const moves = [];
  for (const primary of primaries) {
    const next = points.slice();
    if (primary.type === "move") next[primary.from] = null;
    next[primary.to] = side;
    const formed = POINT_MILLS[primary.to].some((mill) => millComplete(next, side, mill));
    if (!formed) { moves.push({ primary, removeIdx: null }); continue; }
    const oppSide = nmmOpponent(side);
    const oppPieces = [];
    for (let i = 0; i < 24; i++) if (next[i] === oppSide) oppPieces.push(i);
    const inMill = pointsInMills(next, oppSide);
    const removable = oppPieces.filter((i) => !inMill.has(i));
    const choices = removable.length > 0 ? removable : oppPieces;
    for (const removeIdx of choices) moves.push({ primary, removeIdx });
  }
  return moves;
}

function nmmApplyMove(points, side, hand, move) {
  const next = points.slice();
  if (move.primary.type === "move") next[move.primary.from] = null;
  next[move.primary.to] = side;
  if (move.removeIdx !== null) next[move.removeIdx] = null;
  const nextHand = move.primary.type === "place" ? hand - 1 : hand;
  return { points: next, hand: nextHand };
}

function nmmEvaluate(points, youHand, cpuHand, aiSide) {
  const oppSide = nmmOpponent(aiSide);
  const aiOnBoard = points.filter((p) => p === aiSide).length;
  const oppOnBoard = points.filter((p) => p === oppSide).length;
  const aiHand = aiSide === "you" ? youHand : cpuHand;
  const oppHand = aiSide === "you" ? cpuHand : youHand;
  if (oppOnBoard + oppHand < 3) return 100000;
  if (aiOnBoard + aiHand < 3) return -100000;
  let score = (aiOnBoard - oppOnBoard) * 30;
  // Mobility proxy: sum of each piece's adjacency count. Corner points (2
  // neighbours) are structurally weaker than crossroads (4), which is a
  // real, well-known strategic fact about this board — cheap to compute
  // and worth more than material alone near the "no legal move" loss
  // condition.
  for (let i = 0; i < 24; i++) {
    if (points[i] === aiSide) score += ADJACENCY[i].size;
    else if (points[i] === oppSide) score -= ADJACENCY[i].size;
  }
  return score;
}

// Depth-limited minimax with alpha-beta pruning — no randomness in this
// game, so unlike Ur's expectiminimax, a plain search is the honest tool
// here. One "ply" = one side's fully-resolved composite move (including
// any removal), matching how both Hnefatafl's and Ur's search treat a
// full turn as the unit the tree alternates on.
const NMM_SEARCH_DEPTH = 3; // tuning knob — early placement-phase branching is the expensive case; drop to 2 first if it ever feels sluggish

function nmmMinimax(points, youHand, cpuHand, sideToMove, depth, alpha, beta, aiSide, variant) {
  const oppSide = nmmOpponent(sideToMove);
  const oppOnBoard = points.filter((p) => p === oppSide).length;
  const oppHand = oppSide === "you" ? youHand : cpuHand;
  if (oppOnBoard + oppHand < 3) return sideToMove === aiSide ? 100000 + depth : -100000 - depth;
  if (depth === 0) return nmmEvaluate(points, youHand, cpuHand, aiSide);

  const inPlacementPhase = !variant.laskerHybrid && (youHand > 0 || cpuHand > 0);
  const hand = sideToMove === "you" ? youHand : cpuHand;
  const moves = nmmGenerateMoves(points, sideToMove, hand, variant, inPlacementPhase);
  if (moves.length === 0) {
    // No legal move at all — sideToMove loses immediately (Morris' reversed-
    // from-chess "can't move, you lose" rule).
    return sideToMove === aiSide ? -100000 - depth : 100000 + depth;
  }

  const maximizing = sideToMove === aiSide;
  let best = maximizing ? -Infinity : Infinity;
  for (const move of moves) {
    const result = nmmApplyMove(points, sideToMove, hand, move);
    const nextYouHand = sideToMove === "you" ? result.hand : youHand;
    const nextCpuHand = sideToMove === "cpu" ? result.hand : cpuHand;
    const val = nmmMinimax(result.points, nextYouHand, nextCpuHand, oppSide, depth - 1, alpha, beta, aiSide, variant);
    if (maximizing) { if (val > best) best = val; if (val > alpha) alpha = val; }
    else { if (val < best) best = val; if (val < beta) beta = val; }
    if (beta <= alpha) break;
  }
  return best;
}

function chooseNmmMove(points, youHand, cpuHand, aiSide, variant) {
  const inPlacementPhase = !variant.laskerHybrid && (youHand > 0 || cpuHand > 0);
  const hand = aiSide === "you" ? youHand : cpuHand;
  const moves = nmmGenerateMoves(points, aiSide, hand, variant, inPlacementPhase);
  if (moves.length === 0) return null;
  const oppSide = nmmOpponent(aiSide);
  let bestMove = moves[0], bestVal = -Infinity;
  for (const move of moves) {
    const result = nmmApplyMove(points, aiSide, hand, move);
    const nextYouHand = aiSide === "you" ? result.hand : youHand;
    const nextCpuHand = aiSide === "cpu" ? result.hand : cpuHand;
    const val = nmmMinimax(result.points, nextYouHand, nextCpuHand, oppSide, NMM_SEARCH_DEPTH - 1, -Infinity, Infinity, aiSide, variant);
    if (val > bestVal) { bestVal = val; bestMove = move; }
  }
  return bestMove;
}

function PieceStack({ t, label, hand, captured, pegFrom, pegTo, width }) {
  const dotSize = 15, gap = 3, maxSlots = 10; // 10 not 9 — Lasker's piece count is the new max, standard/classic just render fewer
  const slotHeight = maxSlots * dotSize + (maxSlots - 1) * gap;
  return (
    <div style={{ width, display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
      <div style={{ fontSize: 9, color: t.muted, letterSpacing: 1, fontWeight: 700, marginBottom: 6 }}>
        {label}
      </div>
      {/* Fixed-height, bottom-anchored: the stack stays rooted to the floor
          of this box and drains from the top as pieces get placed. */}
      <div style={{ height: slotHeight, display: "flex", flexDirection: "column", justifyContent: "flex-end", alignItems: "center", gap }}>
        {Array.from({ length: hand }).map((_, i) => (
          <div key={`hand-${i}`} style={{
            width: dotSize, height: dotSize, borderRadius: "50%",
            background: `radial-gradient(circle at 35% 30%, ${pegFrom}, ${pegTo})`,
            boxShadow: "0 1px 2px rgba(0,0,0,0.4)",
          }} />
        ))}
      </div>
      {captured > 0 && (
        <>
          <div style={{ width: "60%", height: 1, background: t.panelBorder, margin: "8px 0" }} />
          <div style={{ fontSize: 8, color: t.muted, letterSpacing: 0.5, marginBottom: 4 }}>OUT</div>
          {/* Same fixed-height, bottom-anchored box — but here it means new
              captures fill the box upward from the floor, like a gauge. */}
          <div style={{ height: slotHeight, display: "flex", flexDirection: "column", justifyContent: "flex-end", alignItems: "center", gap }}>
            {Array.from({ length: captured }).map((_, i) => (
              <div key={`cap-${i}`} style={{
                width: dotSize, height: dotSize, borderRadius: "50%",
                background: `radial-gradient(circle at 35% 30%, ${pegFrom}, ${pegTo})`,
                boxShadow: "0 1px 2px rgba(0,0,0,0.4)",
              }} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// Deliberately plainer visual treatment than the local game — no PieceStack
// component, no capture pop animations. Same principle as Hnefatafl's own
// online mode: prove the feature works first, polish once it's proven
// itself with real friend-pairs.
function NmmOnlineGameView({ t, isPro, freemium, onGameCompleted, onUnlock, unlocking, checkoutError, restoreEmail, setRestoreEmail, restoreStatus, onSubmitRestore, showRestoreForm, setShowRestoreForm, onBack }) {
  const GAME_KEY = "nmm";
  const [phase, setPhase] = useState("loading"); // loading | menu | invitePending | joinPreview | active
  const [myRecord, setMyRecord] = useState(() => loadOnlineGameRecord());
  const [game, setGame] = useState(null);
  const [inviteUrl, setInviteUrl] = useState("");
  const [joinPreview, setJoinPreview] = useState(null);
  const [joinToken, setJoinToken] = useState(null);
  const [selected, setSelected] = useState(null);
  const [pendingLocalRemoval, setPendingLocalRemoval] = useState(null); // { primary, removable: Set }
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [copyLabel, setCopyLabel] = useState("Copy Link");
  const [gateActive, setGateActive] = useState(() => !isPro && isQuotaExhausted(freemium, GAME_KEY, "online"));
  const wonRef = useRef(false);

  useEffect(() => {
    (async () => {
      if (myRecord && myRecord.gameId && myRecord.gameType === "nmm") {
        try {
          const state = await onlineApiGet(`/games/${myRecord.gameId}/state`);
          setGame(state);
          wonRef.current = state.status === "finished";
          setPhase(state.status === "waiting" ? "invitePending" : "active");
          return;
        } catch (e) {
          clearOnlineGameRecord();
          setMyRecord(null);
        }
      }
      const token = getInviteTokenFromUrl();
      if (token) {
        try {
          const preview = await onlineApiGet(`/invite/${token}`);
          if (preview.gameType !== "nmm") {
            setErrorMsg("That invite is for a different game.");
            stripInviteFromUrl();
            setPhase("menu");
            return;
          }
          setJoinToken(token);
          setJoinPreview(preview);
          setPhase("joinPreview");
          return;
        } catch (e) {
          setErrorMsg("That invite link isn't valid anymore — ask your friend to send a new one.");
          stripInviteFromUrl();
        }
      }
      setPhase("menu");
    })();
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    if (phase !== "invitePending" && phase !== "active") return;
    if (!myRecord?.gameId) return;
    const timer = setInterval(async () => {
      try {
        const state = await onlineApiGet(`/games/${myRecord.gameId}/state`);
        setGame(state);
        if (phase === "invitePending" && state.status === "active") setPhase("active");
        if (state.status === "finished" && !wonRef.current) {
          wonRef.current = true;
          onGameCompleted(GAME_KEY, "online");
        }
      } catch (e) { /* transient hiccup, try again next tick */ }
    }, 5000);
    return () => clearInterval(timer);
  }, [phase, myRecord]);

  async function createInvite() {
    if (!isPro && isQuotaExhausted(freemium, GAME_KEY, "online")) { setGateActive(true); return; }
    setBusy(true);
    setErrorMsg("");
    try {
      const res = await onlineApiPost("/invite/create", { gameType: "nmm", variant: NMM_DEFAULT_VARIANT_KEY });
      const rec = { gameId: res.gameId, secret: res.hostSecret, side: "you", gameType: "nmm", variant: res.variant };
      saveOnlineGameRecord(rec);
      setMyRecord(rec);
      setInviteUrl(res.url);
      wonRef.current = false;
      setPhase("invitePending");
    } catch (e) {
      setErrorMsg(e.message || "Couldn't create an invite right now.");
    } finally {
      setBusy(false);
    }
  }

  async function joinGame() {
    if (!joinToken) return;
    if (!isPro && isQuotaExhausted(freemium, GAME_KEY, "online")) { setGateActive(true); return; }
    setBusy(true);
    setErrorMsg("");
    try {
      const res = await onlineApiPost(`/invite/${joinToken}/redeem`, {});
      const rec = { gameId: res.gameId, secret: res.guestSecret, side: res.guestSide, gameType: "nmm", variant: res.variant };
      saveOnlineGameRecord(rec);
      setMyRecord(rec);
      stripInviteFromUrl();
      wonRef.current = false;
      const state = await onlineApiGet(`/games/${res.gameId}/state`);
      setGame(state);
      setPhase("active");
    } catch (e) {
      setErrorMsg(e.message || "Couldn't join that game — the link may have just been used.");
    } finally {
      setBusy(false);
    }
  }

  function leaveGame() {
    clearOnlineGameRecord();
    setMyRecord(null);
    setGame(null);
    setSelected(null);
    setPendingLocalRemoval(null);
    setPhase("menu");
  }

  async function shareInvite() {
    try {
      if (navigator.share) await navigator.share({ title: "Nine Men's Morris", text: "Join me for a game of Nine Men's Morris:", url: inviteUrl });
      else await copyInvite();
    } catch (e) { /* cancelled share sheet, not an error */ }
  }
  async function copyInvite() {
    try {
      await navigator.clipboard.writeText(inviteUrl);
      setCopyLabel("Copied!");
      setTimeout(() => setCopyLabel("Copy Link"), 1800);
    } catch (e) { /* clipboard denied — link is still shown to copy manually */ }
  }

  const variant = NMM_VARIANTS[game?.variant] || NMM_VARIANTS[NMM_DEFAULT_VARIANT_KEY];
  const mySide = myRecord?.side;
  const myTurn = game && game.status === "active" && game.turn === mySide;
  const inPlacementPhase = game ? !variant.laskerHybrid && (game.youHand > 0 || game.cpuHand > 0) : false;
  const myHand = game ? (mySide === "you" ? game.youHand : game.cpuHand) : 0;
  const canPlaceNow = variant.laskerHybrid ? myHand > 0 : (inPlacementPhase && myHand > 0);
  const canMoveNow = variant.laskerHybrid || !inPlacementPhase;
  const myOnBoard = game ? game.points.filter((p) => p === mySide).length : 0;
  const myFlying = variant.flyingEnabled && !inPlacementPhase && myOnBoard === 3;

  const legalDestSet = useMemo(() => {
    if (!game || selected === null || !myTurn) return new Set();
    return new Set(legalDestinations(game.points, selected, myFlying));
  }, [game, selected, myTurn, myFlying]);

  // Submits a fully-decided composite move (mill removal, if any, already
  // chosen) to the server — the actual source of truth. Client-side mill
  // pre-detection below only exists to drive the two-tap "place, then pick
  // who to remove" UI; the server independently re-derives whether a mill
  // formed and never trusts this client's opinion of it.
  async function submitMove(primary, removeIdx) {
    setBusy(true);
    setErrorMsg("");
    try {
      const updated = await onlineApiPost(`/games/${myRecord.gameId}/move`, { move: { primary, removeIdx } }, myRecord.secret);
      setGame(updated);
      if (updated.status === "finished" && !wonRef.current) {
        wonRef.current = true;
        onGameCompleted(GAME_KEY, "online");
      }
    } catch (e) {
      setErrorMsg(e.message || "That move didn't go through — the board may have just changed.");
    } finally {
      setPendingLocalRemoval(null);
      setSelected(null);
      setBusy(false);
    }
  }

  function tryPrimary(primary) {
    setSelected(null);
    const tentative = game.points.slice();
    if (primary.type === "move") tentative[primary.from] = null;
    tentative[primary.to] = mySide;
    const formed = POINT_MILLS[primary.to].some((mill) => millComplete(tentative, mySide, mill));
    if (!formed) { submitMove(primary, null); return; }
    const oppSide = mySide === "you" ? "cpu" : "you";
    const oppPieces = [];
    for (let i = 0; i < 24; i++) if (tentative[i] === oppSide) oppPieces.push(i);
    const inMill = pointsInMills(tentative, oppSide);
    const removable = oppPieces.filter((i) => !inMill.has(i));
    setPendingLocalRemoval({ primary, removable: new Set(removable.length > 0 ? removable : oppPieces) });
  }

  function handlePointClick(idx) {
    if (!game || !myTurn || busy) return;
    if (pendingLocalRemoval) {
      if (!pendingLocalRemoval.removable.has(idx)) return;
      submitMove(pendingLocalRemoval.primary, idx);
      return;
    }
    if (canPlaceNow && game.points[idx] === null) { tryPrimary({ type: "place", to: idx }); return; }
    if (selected === null) {
      if (game.points[idx] === mySide && canMoveNow && legalDestinations(game.points, idx, myFlying).length > 0) setSelected(idx);
      return;
    }
    if (legalDestSet.has(idx)) {
      tryPrimary({ type: "move", from: selected, to: idx });
    } else if (game.points[idx] === mySide) {
      setSelected(idx);
    } else {
      setSelected(null);
    }
  }

  const wrap = { display: "flex", flexDirection: "column", alignItems: "center", width: "100%", maxWidth: 460 };

  if (gateActive) {
    return (
      <FreemiumGate
        t={t} gameLabel="Nine Men's Morris" modeLabel="Online" onBack={onBack}
        onUnlock={onUnlock} unlocking={unlocking} checkoutError={checkoutError}
        restoreEmail={restoreEmail} setRestoreEmail={setRestoreEmail} restoreStatus={restoreStatus}
        onSubmitRestore={onSubmitRestore} showRestoreForm={showRestoreForm} setShowRestoreForm={setShowRestoreForm}
      />
    );
  }

  if (phase === "loading") return <div style={{ ...wrap, color: t.muted, fontSize: 13, padding: 30 }}>Loading…</div>;

  if (phase === "menu") {
    const count = freemium.counts[freemiumSlotKey(GAME_KEY, "online")] || 0;
    const remaining = Math.max(0, FREE_GAMES_PER_MODE_PER_DAY - count);
    return (
      <div style={wrap}>
        <div style={{ fontSize: 14, color: t.text, textAlign: "center", lineHeight: 1.6, marginBottom: 10 }}>
          Send a friend a private link and play a game together — no account needed. Only someone with the exact link can join; there's no public lobby or search.
        </div>
        <div style={{ fontSize: 12, color: t.muted, textAlign: "center", marginBottom: 16 }}>
          {isPro ? "Unlimited online games — thanks for going Pro." : `${remaining} of ${FREE_GAMES_PER_MODE_PER_DAY} free online games left today.`}
        </div>
        <button onClick={createInvite} disabled={busy} style={{ ...btnStyle(t, busy, true), padding: "12px 22px", fontSize: 14 }}>
          {busy ? "Creating…" : "🤝 Invite a Friend"}
        </button>
        {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 12, textAlign: "center" }}>{errorMsg}</div>}
      </div>
    );
  }

  if (phase === "joinPreview") {
    return (
      <div style={wrap}>
        <div style={{ fontSize: 15, color: t.text, textAlign: "center", lineHeight: 1.6, marginBottom: 16 }}>
          You've been invited to a game of Nine Men's Morris{joinPreview?.variant ? ` (${NMM_VARIANTS[joinPreview.variant]?.key === joinPreview.variant ? joinPreview.variant : joinPreview.variant} rules)` : ""}.
        </div>
        <button onClick={joinGame} disabled={busy} style={{ ...btnStyle(t, busy, true), padding: "12px 22px", fontSize: 14 }}>
          {busy ? "Joining…" : "⚔️ Join Game"}
        </button>
        {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 12, textAlign: "center" }}>{errorMsg}</div>}
      </div>
    );
  }

  if (phase === "invitePending") {
    return (
      <div style={wrap}>
        <div style={{ fontSize: 14, color: t.text, textAlign: "center", marginBottom: 14 }}>
          Waiting for your friend to open the link and join…
        </div>
        <div style={{
          width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${t.panelBorder}`,
          background: t.panel, color: t.muted, fontSize: 12, wordBreak: "break-all", marginBottom: 10, textAlign: "center",
        }}>
          {inviteUrl}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={shareInvite} style={{ ...btnStyle(t, false), fontSize: 13 }}>📤 Share</button>
          <button onClick={copyInvite} style={{ ...btnStyle(t, false), fontSize: 13 }}>{copyLabel}</button>
          <button onClick={leaveGame} style={{ ...btnStyle(t, false), fontSize: 13 }}>Cancel</button>
        </div>
      </div>
    );
  }

  if (!game) return <div style={{ ...wrap, color: t.muted, fontSize: 13, padding: 30 }}>Loading…</div>;

  const CELL = 26, PAD = 24, BOARD_PX = 6 * CELL + PAD * 2;

  return (
    <div style={wrap}>
      <div style={{ fontSize: 13, color: t.text, textAlign: "center", marginBottom: 6 }}>
        {game.status === "finished"
          ? (game.winner === mySide ? "You won!" : "Your friend won.")
          : pendingLocalRemoval
          ? "Mill! Tap one of your friend's pieces to remove it."
          : myTurn ? "Your move." : "Waiting for your friend's move…"}
      </div>
      <div style={{ fontSize: 11, color: t.muted, marginBottom: 12 }}>
        You: {game.points.filter((p) => p === mySide).length} on board{myHand > 0 ? ` (+${myHand} in hand)` : ""}
      </div>

      <div style={{ position: "relative", width: BOARD_PX, height: BOARD_PX, background: t.panel, borderRadius: 14, boxShadow: `inset 0 0 0 1px ${t.panelBorder}` }}>
        {EDGES.map(([a, b], i) => {
          const pa = POINTS[a], pb = POINTS[b];
          const x1 = PAD + pa.x * CELL, y1 = PAD + pa.y * CELL;
          const x2 = PAD + pb.x * CELL, y2 = PAD + pb.y * CELL;
          const horizontal = y1 === y2;
          const style = horizontal
            ? { left: Math.min(x1, x2), top: y1 - 1, width: Math.abs(x2 - x1), height: 2 }
            : { left: x1 - 1, top: Math.min(y1, y2), width: 2, height: Math.abs(y2 - y1) };
          return <div key={i} style={{ position: "absolute", background: t.lineColor, ...style }} />;
        })}
        {POINTS.map((p, idx) => {
          const x = PAD + p.x * CELL, y = PAD + p.y * CELL;
          const side = game.points[idx];
          const isDest = legalDestSet.has(idx);
          const isRemovable = pendingLocalRemoval && pendingLocalRemoval.removable.has(idx);
          const isSelected = selected === idx;
          const size = 22;
          return (
            <div key={idx} onClick={() => handlePointClick(idx)} style={{
              position: "absolute", left: x - 14, top: y - 14, width: 28, height: 28,
              display: "flex", alignItems: "center", justifyContent: "center",
              cursor: myTurn ? "pointer" : "default",
            }}>
              {!side && (
                <div style={{
                  width: 10, height: 10, borderRadius: "50%", background: t.holeEmpty,
                  boxShadow: isDest ? `0 0 0 3px ${t.accent}` : isRemovable ? "0 0 0 3px #ff6b57" : "inset 0 1px 2px rgba(0,0,0,0.5)",
                }} />
              )}
              {side && (
                <div style={{
                  width: size, height: size, borderRadius: "50%",
                  background: side === "you"
                    ? `radial-gradient(circle at 35% 30%, ${t.pegFrom}, ${t.pegTo})`
                    : `radial-gradient(circle at 35% 30%, ${CPU_FROM}, ${CPU_TO})`,
                  boxShadow: isSelected ? `0 0 0 3px ${t.accent}` : isRemovable ? "0 0 0 3px #ff6b57" : "0 2px 3px rgba(0,0,0,0.5)",
                }} />
              )}
            </div>
          );
        })}
      </div>

      {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 10, textAlign: "center" }}>{errorMsg}</div>}
      <button onClick={leaveGame} style={{ ...btnStyle(t, false), fontSize: 12, marginTop: 14 }}>
        {game.status === "finished" ? "Leave Game" : "Forfeit & Leave"}
      </button>
    </div>
  );
}

function NineMensMorris({ onBack, isPro, freemium, onGameCompleted, onUnlock, unlocking, checkoutError, restoreEmail, setRestoreEmail, restoreStatus, onSubmitRestore, showRestoreForm, setShowRestoreForm }) {
  const GAME_KEY = "nmm";
  const NMM_INTRO_SEEN_KEY = "ancient_games_intro_seen_nmm_v1";
  const [showIntro, setShowIntro] = useState(() => {
    try { return localStorage.getItem(NMM_INTRO_SEEN_KEY) !== "1"; } catch (e) { return true; }
  });
  function dismissIntro() {
    try { localStorage.setItem(NMM_INTRO_SEEN_KEY, "1"); } catch (e) { /* ignore */ }
    setShowIntro(false);
  }
  const [themeKey, setThemeKey] = useState("dark");
  const t = THEMES[themeKey];
  const [upsell, setUpsell] = useState(null);
  function selectTheme(key) {
    const theme = THEMES[key];
    if (theme.tier === "pro" && !isPro) {
      setUpsell(theme.name);
      setTimeout(() => setUpsell(null), 2200);
      return;
    }
    setThemeKey(key);
  }
  const [mode, setMode] = useState(() => (getInviteTokenFromUrl() ? "online" : "challenge")); // "play" (hotseat) | "challenge" (vs AI) | "online"
  const [variantKey, setVariantKey] = useState(NMM_DEFAULT_VARIANT_KEY);
  const variant = NMM_VARIANTS[variantKey];
  const [gateActive, setGateActive] = useState(() => !isPro && isQuotaExhausted(freemium, GAME_KEY, "challenge"));
  const wonRef = useRef(false);

  function sideLabel(side) {
    if (mode === "play") return side === "you" ? "Player 1" : "Player 2";
    return side === "you" ? "You" : "CPU";
  }

  const PAD = 30, MIN_CELL = 38, MAX_CELL = 66, MAX_BOARD_WIDTH = 480;
  const SIDE_COL_WIDTH = 34;
  const [viewportWidth, setViewportWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 390);
  useEffect(() => {
    const onResize = () => setViewportWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const CELL = useMemo(() => {
    const usableWidth = Math.min(viewportWidth - 24 - (SIDE_COL_WIDTH + 10) * 2, MAX_BOARD_WIDTH);
    const raw = (usableWidth - PAD * 2) / 6;
    return Math.max(MIN_CELL, Math.min(MAX_CELL, raw));
  }, [viewportWidth]);
  const boardSize = 6 * CELL + PAD * 2;

  // ---------- Game state ----------
  const [points, setPoints] = useState(() => Array(24).fill(null)); // null | "you" | "cpu"
  const [youHand, setYouHand] = useState(variant.pieceCount);
  const [cpuHand, setCpuHand] = useState(variant.pieceCount);
  const [turn, setTurn] = useState("you");
  const [selected, setSelected] = useState(null);
  const [pendingRemoval, setPendingRemoval] = useState(null); // "you" | "cpu" | null
  const [winner, setWinner] = useState(null);
  const [message, setMessage] = useState("Place your first piece.");
  const [millPopKey, setMillPopKey] = useState(0);
  const [millPopSide, setMillPopSide] = useState("you");
  const [glow, setGlow] = useState(null); // { side, key } | null
  const [capturedYou, setCapturedYou] = useState(0);
  const [capturedCpu, setCapturedCpu] = useState(0);
  const cpuTimer = useRef(null);
  const cpuRemovalRef = useRef(null); // stashes the AI's already-decided removal choice between the place/move tick and the removal tick

  const youOnBoard = points.filter((p) => p === "you").length;
  const cpuOnBoard = points.filter((p) => p === "cpu").length;

  // "Placement phase" is a real global-turn concept for Standard/Classic
  // (place all pieces first, then move) but doesn't exist at all under
  // Lasker (place-or-move is a free per-turn choice) — laskerHybrid short-
  // circuits this to permanently false, which correctly cascades through
  // every other phase-dependent value below.
  const inPlacementPhase = !variant.laskerHybrid && (youHand > 0 || cpuHand > 0);
  const youFlying = variant.flyingEnabled && !inPlacementPhase && youOnBoard === 3;
  const cpuFlying = variant.flyingEnabled && !inPlacementPhase && cpuOnBoard === 3;

  const turnHand = turn === "you" ? youHand : cpuHand;
  const canPlaceNow = variant.laskerHybrid ? turnHand > 0 : (inPlacementPhase && turnHand > 0);
  const canMoveNow = variant.laskerHybrid || !inPlacementPhase;
  const humanCanAct = mode === "play" || turn === "you";

  const legalPieceSet = useMemo(() => {
    if (!canMoveNow || pendingRemoval || winner) return new Set();
    const s = new Set();
    for (let i = 0; i < 24; i++) {
      if (points[i] !== turn) continue;
      if (legalDestinations(points, turn, i, turn === "you" ? youFlying : cpuFlying).length > 0) s.add(i);
    }
    return s;
  }, [points, canMoveNow, turn, pendingRemoval, winner, youFlying, cpuFlying]);

  const legalDestSet = useMemo(() => {
    if (selected === null) return new Set();
    return new Set(legalDestinations(points, turn, selected, turn === "you" ? youFlying : cpuFlying));
  }, [selected, points, turn, youFlying, cpuFlying]);

  const removableSet = useMemo(() => {
    if (!pendingRemoval) return new Set();
    const opp = pendingRemoval === "you" ? "cpu" : "you";
    const oppPieces = [];
    for (let i = 0; i < 24; i++) if (points[i] === opp) oppPieces.push(i);
    const inMill = pointsInMills(points, opp);
    const notInMill = oppPieces.filter((i) => !inMill.has(i));
    return new Set(notInMill.length > 0 ? notInMill : oppPieces);
  }, [pendingRemoval, points]);

  function triggerMill(side) {
    setMillPopSide(side);
    setMillPopKey((k) => k + 1);
    setGlow({ side, key: Date.now() });
    setTimeout(() => setGlow(null), 1300);
  }

  function afterPlacementOrMove(nextPoints, side, destIdx) {
    const formedMills = POINT_MILLS[destIdx].filter((mill) => millComplete(nextPoints, side, mill));
    if (formedMills.length > 0) {
      triggerMill(side);
      setMessage(`${sideLabel(side)} formed a mill — remove an opposing piece.`);
      setPendingRemoval(side);
    } else {
      finishTurn(nextPoints, side);
    }
  }

  function finishTurn(nextPoints, sideJustMoved) {
    const opp = sideJustMoved === "you" ? "cpu" : "you";
    const oppOnBoard = nextPoints.filter((p) => p === opp).length;
    const oppHand = opp === "you" ? youHand : cpuHand;
    if (oppOnBoard + oppHand < 3) {
      setWinner(sideJustMoved);
      setMessage(`${sideLabel(sideJustMoved)} wins — ${sideLabel(opp)} is down to two pieces!`);
      return;
    }
    const oppFlying = variant.flyingEnabled && !inPlacementPhase && oppOnBoard === 3;
    if (!inPlacementPhase && !sideCanMove(nextPoints, opp, oppFlying)) {
      setWinner(sideJustMoved);
      setMessage(`${sideLabel(sideJustMoved)} wins — ${sideLabel(opp)} has no legal moves!`);
      return;
    }
    setTurn(opp);
    setSelected(null);
    setMessage(`${sideLabel(opp)}'s move.`);
  }

  function placeAt(side, idx) {
    if (points[idx] !== null) return;
    const next = [...points];
    next[idx] = side;
    setPoints(next);
    if (side === "you") setYouHand((h) => h - 1); else setCpuHand((h) => h - 1);
    afterPlacementOrMove(next, side, idx);
  }

  function moveTo(side, fromIdx, toIdx) {
    const next = [...points];
    next[fromIdx] = null;
    next[toIdx] = side;
    setPoints(next);
    afterPlacementOrMove(next, side, toIdx);
  }

  function removeAt(side, idx) {
    const next = [...points];
    next[idx] = null;
    setPoints(next);
    const opp = side === "you" ? "cpu" : "you";
    if (opp === "you") setCapturedYou((c) => c + 1); else setCapturedCpu((c) => c + 1);
    setPendingRemoval(null);
    finishTurn(next, side);
  }

  function handlePointClick(idx) {
    if (winner) return;
    if (mode === "challenge" && turn !== "you") return;
    const side = turn;

    if (pendingRemoval === side) {
      if (removableSet.has(idx)) removeAt(side, idx);
      return;
    }
    if (canPlaceNow && points[idx] === null) {
      // Under Lasker, a click on an empty point always reads as "place" —
      // intending to move instead is expressed by clicking one of your own
      // pieces FIRST (the branch below), so there's no real ambiguity even
      // though both actions are legal on the same turn.
      placeAt(side, idx);
      return;
    }
    if (selected === null) {
      if (points[idx] === side && legalPieceSet.has(idx)) setSelected(idx);
      return;
    }
    if (legalDestSet.has(idx)) {
      moveTo(side, selected, idx);
    } else if (points[idx] === side && legalPieceSet.has(idx)) {
      setSelected(idx);
    } else {
      setSelected(null);
    }
  }

  // ---------- CPU opponent (Challenge mode only) ----------
  // Real minimax + alpha-beta now, replacing the old three-heuristic setup
  // (separate hand-tuned priority lists for placement/movement/removal).
  // chooseNmmMove decides a full composite turn — primary action plus
  // whichever removal it determined is best — in one search, so the CPU's
  // removal choice is the one the search actually reasoned about, not a
  // second, disconnected heuristic guess. cpuRemovalRef bridges the two
  // React ticks placeAt/moveTo → afterPlacementOrMove(async render) →
  // this effect firing again with pendingRemoval==="cpu": the removal
  // index picked in the FIRST tick is what actually gets used in the
  // second, not a re-decided one.
  useEffect(() => {
    if (mode !== "challenge") return;
    if (turn !== "cpu" || winner) return;
    if (pendingRemoval === "cpu") {
      const idx = cpuRemovalRef.current;
      const fallback = [...removableSet][0];
      const chosenIdx = idx !== null && removableSet.has(idx) ? idx : fallback;
      const t1 = setTimeout(() => removeAt("cpu", chosenIdx), 500);
      cpuTimer.current = t1;
      return () => clearTimeout(t1);
    }
    const chosen = chooseNmmMove(points, youHand, cpuHand, "cpu", variant);
    if (!chosen) return; // no legal move — finishTurn already handles the loss condition from the preceding turn
    cpuRemovalRef.current = chosen.removeIdx;
    const t1 = setTimeout(() => {
      if (chosen.primary.type === "place") placeAt("cpu", chosen.primary.to);
      else moveTo("cpu", chosen.primary.from, chosen.primary.to);
    }, 700);
    cpuTimer.current = t1;
    return () => clearTimeout(t1);
    // eslint-disable-next-line
  }, [mode, turn, pendingRemoval, points, youHand, cpuHand, winner, variant]);

  const reset = useCallback(() => {
    setPoints(Array(24).fill(null));
    setYouHand(variant.pieceCount); setCpuHand(variant.pieceCount);
    setTurn("you"); setSelected(null);
    setPendingRemoval(null); setWinner(null);
    setCapturedYou(0); setCapturedCpu(0);
    setMessage("Place your first piece.");
    cpuRemovalRef.current = null;
    wonRef.current = false;
  }, [variant]);

  function startFreshGame(nextMode) {
    if (!isPro && isQuotaExhausted(freemium, GAME_KEY, nextMode)) { setGateActive(true); return; }
    setGateActive(false);
    reset();
  }
  function handleSetMode(next) { setMode(next); startFreshGame(next); }
  function handleSetVariantKey(next) { setVariantKey(next); startFreshGame(mode); }

  useEffect(() => {
    if (winner && !wonRef.current) {
      wonRef.current = true;
      onGameCompleted(GAME_KEY, mode);
    }
  }, [winner, mode]);

  const inMillSet = useMemo(() => new Set([...pointsInMills(points, "you"), ...pointsInMills(points, "cpu")]), [points]);

  if (gateActive) {
    return (
      <FreemiumGate
        t={t} gameLabel="Nine Men's Morris" modeLabel={mode === "play" ? "Play" : "Challenge"} onBack={onBack}
        onUnlock={onUnlock} unlocking={unlocking} checkoutError={checkoutError}
        restoreEmail={restoreEmail} setRestoreEmail={setRestoreEmail} restoreStatus={restoreStatus}
        onSubmitRestore={onSubmitRestore} showRestoreForm={showRestoreForm} setShowRestoreForm={setShowRestoreForm}
      />
    );
  }

  if (mode === "online") {
    return (
      <NmmOnlineGameView
        t={t} isPro={isPro} freemium={freemium} onGameCompleted={onGameCompleted}
        onUnlock={onUnlock} unlocking={unlocking} checkoutError={checkoutError}
        restoreEmail={restoreEmail} setRestoreEmail={setRestoreEmail} restoreStatus={restoreStatus}
        onSubmitRestore={onSubmitRestore} showRestoreForm={showRestoreForm} setShowRestoreForm={setShowRestoreForm}
        onBack={onBack}
      />
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: t.bg, color: t.text, fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif", display: "flex", flexDirection: "column", alignItems: "center", padding: "20px 12px 40px", transition: "background 200ms ease, color 200ms ease" }}>

      {showIntro && (
        <IntroCrawl
          seriesLabel="ANCIENT GAMES · 03"
          gameTitle="NINE MEN'S MORRIS"
          gameTagline="~3,400-year-old strategy game · no dice, no luck, just the mill"
          crawlText={NMM_CRAWL}
          crawlDurationMs={31000}
          motto={[["FORTES FORTUNA ADIUVAT", "\"Fortune Favours The Brave\" — Terence, Phormio, 161 BC"]]}
          mottoFont="Georgia, serif"
          mottoFontSize={26}
          onDone={dismissIntro}
        />
      )}

      <style>{`
        @keyframes msgPop {
          0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
          15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
          25% { transform: translate(-50%, -50%) scale(1); }
          75% { opacity: 1; }
          100% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
        }
        @keyframes glowBurst {
          0% { opacity: 0; } 18% { opacity: 0.9; } 70% { opacity: 0.9; } 100% { opacity: 0; }
        }
        .nmm-glow-top, .nmm-glow-bottom {
          position: fixed; left: 0; right: 0; height: 30vh;
          pointer-events: none; z-index: 900;
          animation: glowBurst 1.3s ease-out forwards;
        }
        .nmm-glow-top { top: 0; }
        .nmm-glow-bottom { bottom: 0; }
      `}</style>

      {glow && (() => {
        const c1 = glow.side === "you" ? "232,196,104" : "127,232,201";
        return (
          <React.Fragment key={glow.key}>
            <div className="nmm-glow-top" style={{ background: `linear-gradient(to bottom, rgba(${c1},0.35) 0%, transparent 100%)` }} />
            <div className="nmm-glow-bottom" style={{ background: `linear-gradient(to top, rgba(${c1},0.35) 0%, transparent 100%)` }} />
          </React.Fragment>
        );
      })()}

      {millPopKey > 0 && (
        <div
          key={`mill-${millPopKey}`}
          style={{ position: "fixed", top: "38vh", left: "50%", zIndex: 951, pointerEvents: "none", animation: "msgPop 1.3s ease forwards", textAlign: "center" }}
        >
          <div style={{
            fontSize: 56, fontWeight: 900, fontFamily: "Georgia, serif", whiteSpace: "nowrap",
            color: millPopSide === "you" ? "#e8c468" : CPU_FROM,
            textShadow: millPopSide === "you"
              ? "0 0 32px rgba(232,196,104,0.85), 0 2px 6px rgba(0,0,0,0.8)"
              : "0 0 32px rgba(127,232,201,0.85), 0 2px 6px rgba(0,0,0,0.8)",
          }}>
            MILL!
          </div>
        </div>
      )}

      <div style={{ textAlign: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 11, letterSpacing: 4, color: t.muted, fontWeight: 700, marginBottom: 4 }}>
          ANCIENT GAMES · 03
        </div>
        <h1 style={{ fontSize: 25, fontWeight: 800, letterSpacing: 1, margin: 0, textTransform: "uppercase" }}>
          Nine Men<span style={{ color: t.accent }}>'</span>s Morris
        </h1>
        <div style={{ fontSize: 11, color: t.muted, marginTop: 4, letterSpacing: 0.5 }}>
          Roman &amp; Egyptian roots · pure strategy, no luck
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12, flexWrap: "wrap", justifyContent: "center" }}>
        <button onClick={onBack} style={pillStyle(t, false)}>← Games</button>
        <button onClick={() => setThemeKey(themeKey === "light" ? "dark" : "light")} style={pillStyle(t, true)}>
          {themeKey === "light" ? "☀️ Light" : "🌙 Dark"}
        </button>
        <button onClick={() => handleSetMode("challenge")} style={pillStyle(t, mode === "challenge")}>🤖 Challenge</button>
        <button onClick={() => handleSetMode("play")} style={pillStyle(t, mode === "play")}>🧑‍🤝‍🧑 Play</button>
        <button onClick={() => setMode("online")} style={pillStyle(t, mode === "online")}>🤝 Online</button>
        <span style={{ width: 1, height: 20, background: t.panelBorder }} />
        <button onClick={() => setShowIntro(true)} style={pillStyle(t, false)} title="Watch the intro again">
          🎬
        </button>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <span style={{ fontSize: 11, color: t.muted, fontWeight: 700, letterSpacing: 0.5 }}>Rules:</span>
        <select
          value={variantKey}
          onChange={(e) => handleSetVariantKey(e.target.value)}
          style={{
            padding: "6px 10px", borderRadius: 999, border: `1px solid ${t.panelBorder}`,
            background: t.panel, color: t.text, fontSize: 12, fontWeight: 700, cursor: "pointer",
          }}
        >
          {Object.values(NMM_VARIANTS).map((v) => (
            <option key={v.key} value={v.key}>{v.name} — {v.subtitle}</option>
          ))}
        </select>
      </div>

      {/* Pro tone picker — identical tones, colours, and lock/upsell
          behaviour as Hnefatafl and Jumpin' Pin, for a consistent feel
          across the whole series. One Pro purchase, shared across both
          games in this bundle, unlocks these here too. */}
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16, flexWrap: "wrap", justifyContent: "center" }}>
        {Object.entries(THEMES)
          .filter(([, v]) => v.tier === "pro")
          .map(([key, v]) => (
            <button
              key={key}
              onClick={() => selectTheme(key)}
              title={v.name}
              style={{
                position: "relative", width: 30, height: 30, borderRadius: "50%",
                border: themeKey === key ? `2px solid ${t.accent}` : `1px solid ${t.panelBorder}`,
                background: v.swatch, cursor: "pointer", padding: 0,
              }}
            >
              {!isPro && (
                <span style={{
                  position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
                  background: "rgba(0,0,0,0.45)", borderRadius: "50%", fontSize: 12,
                }}>
                  🔒
                </span>
              )}
            </button>
          ))}
        <span style={{ fontSize: 10, color: t.muted, marginLeft: 2 }}>PRO TONES</span>
        {upsell && (
          <span style={{ fontSize: 11, color: t.accent, fontWeight: 700, marginLeft: 6 }}>
            🔒 {upsell} is a Pro tone — unlock unlimited play to use it.
          </span>
        )}
      </div>

      <div style={{ display: "flex", gap: 18, marginBottom: 14, fontFamily: "'Courier New', monospace", fontSize: 13, background: t.panel, border: `1px solid ${t.panelBorder}`, borderRadius: 10, padding: "8px 18px" }}>
        <div>{sideLabel("you").toUpperCase()} <span style={{ color: t.pegFrom, fontWeight: 700 }}>{youOnBoard}</span>{youHand > 0 ? ` (+${youHand})` : ""}</div>
        <div>{sideLabel("cpu").toUpperCase()} <span style={{ color: CPU_FROM, fontWeight: 700 }}>{cpuOnBoard}</span>{cpuHand > 0 ? ` (+${cpuHand})` : ""}</div>
        <div>TURN <span style={{ color: t.accent, fontWeight: 700 }}>{sideLabel(turn)}</span></div>
      </div>

      <div style={{ fontSize: 13, color: t.muted, marginBottom: 14, textAlign: "center", minHeight: 18, fontWeight: 600, maxWidth: 300 }}>
        {message}
      </div>

      {humanCanAct && (turn === "you" ? youFlying : cpuFlying) && (
        <div style={{ fontSize: 11, color: t.accent, fontWeight: 700, marginBottom: 10 }}>
          Down to 3 — {sideLabel(turn)} can fly to any empty point!
        </div>
      )}

      {/* Board, flanked by each side's piece stacks — top group is pieces
          still to be placed, bottom group (past the divider) is pieces
          that have been captured. Same column reused for both, since a
          piece only ever moves from "in hand" to "on board" to "captured",
          never backwards. */}
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 18 }}>
        <PieceStack t={t} label={sideLabel("you").toUpperCase()} hand={youHand} captured={capturedYou} pegFrom={t.pegFrom} pegTo={t.pegTo} width={SIDE_COL_WIDTH} />

        <div style={{ position: "relative", width: boardSize, height: boardSize, background: t.panel, borderRadius: 18, boxShadow: `inset 0 0 0 1px ${t.panelBorder}, 0 8px 24px rgba(0,0,0,0.35)` }}>
        {EDGES.map(([a, b], i) => {
          const pa = POINTS[a], pb = POINTS[b];
          const x1 = PAD + pa.x * CELL, y1 = PAD + pa.y * CELL;
          const x2 = PAD + pb.x * CELL, y2 = PAD + pb.y * CELL;
          const horizontal = y1 === y2;
          const style = horizontal
            ? { left: Math.min(x1, x2), top: y1 - 1, width: Math.abs(x2 - x1), height: 2 }
            : { left: x1 - 1, top: Math.min(y1, y2), width: 2, height: Math.abs(y2 - y1) };
          return <div key={i} style={{ position: "absolute", background: t.lineColor, ...style }} />;
        })}

        {POINTS.map((p, idx) => {
          const x = PAD + p.x * CELL, y = PAD + p.y * CELL;
          const side = points[idx];
          const size = Math.min(30, CELL * 0.5);
          const isDest = legalDestSet.has(idx);
          const isRemovable = pendingRemoval === turn && removableSet.has(idx);
          const isSelected = selected === idx;
          const isPlaceable = canPlaceNow && humanCanAct && side === null && !pendingRemoval;
          const isMySelectable = humanCanAct && side === turn && legalPieceSet.has(idx) && canMoveNow;
          const clickable = (humanCanAct) && (isPlaceable || isDest || isRemovable || isMySelectable);

          return (
            <div key={idx} onClick={() => handlePointClick(idx)} style={{
              position: "absolute", left: x - Math.max(size, 16) / 2, top: y - Math.max(size, 16) / 2,
              width: Math.max(size, 16), height: Math.max(size, 16),
              display: "flex", alignItems: "center", justifyContent: "center",
              cursor: clickable ? "pointer" : "default",
            }}>
              {!side && (
                <div style={{
                  width: 12, height: 12, borderRadius: "50%",
                  background: t.holeEmpty,
                  boxShadow: (isDest || isPlaceable)
                    ? `0 0 0 3px ${t.accent}`
                    : isRemovable ? `0 0 0 3px #ff6b57` : `inset 0 1px 2px rgba(0,0,0,0.5)`,
                }} />
              )}
              {side && (
                <div style={{
                  width: size, height: size, borderRadius: "50%",
                  background: side === "you"
                    ? `radial-gradient(circle at 35% 30%, ${t.pegFrom}, ${t.pegTo})`
                    : `radial-gradient(circle at 35% 30%, ${CPU_FROM}, ${CPU_TO})`,
                  boxShadow: isSelected
                    ? `0 0 0 3px ${t.accent}, 0 2px 4px rgba(0,0,0,0.5)`
                    : isRemovable
                    ? `0 0 0 3px #ff6b57, 0 2px 4px rgba(0,0,0,0.5)`
                    : isMySelectable
                    ? `0 0 0 2px ${t.accent}66, 0 2px 4px rgba(0,0,0,0.5)`
                    : "0 2px 3px rgba(0,0,0,0.5)",
                  transform: isSelected ? "scale(1.12)" : "scale(1)",
                  transition: "transform 120ms ease, box-shadow 120ms ease",
                }} />
              )}
            </div>
          );
        })}
        </div>

        <PieceStack t={t} label={sideLabel("cpu").toUpperCase()} hand={cpuHand} captured={capturedCpu} pegFrom={CPU_FROM} pegTo={CPU_TO} width={SIDE_COL_WIDTH} />
      </div>

      <button onClick={() => startFreshGame(mode)} style={btnStyle(t, false)}>
        🔄 Reset
      </button>

      {winner && (
        <div style={{ marginTop: 18, textAlign: "center", padding: "14px 20px", borderRadius: 12, background: t.panel, border: `1px solid ${t.panelBorder}`, maxWidth: 320 }}>
          <div style={{ fontSize: 12, letterSpacing: 2, color: t.muted, marginBottom: 4 }}>GAME OVER</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: t.accent, marginBottom: 6 }}>
            {mode === "play" ? `${sideLabel(winner)} wins!` : winner === "you" ? "You win! 🏆" : "The computer wins."}
          </div>
          <button onClick={() => startFreshGame(mode)} style={{ ...btnStyle(t, false, true), marginTop: 8 }}>Play Again</button>
        </div>
      )}

      <div style={{ fontSize: 10, color: t.muted, marginTop: 24, textAlign: "center", maxWidth: 320, lineHeight: 1.6 }}>
        {variant.laskerHybrid
          ? `Place all ${variant.pieceCount} of your pieces whenever you like — on any turn you may place a new piece OR move one already on the board, your choice.`
          : `Place all ${variant.pieceCount} of your pieces, then take turns sliding one piece along a line to an empty point.`}
        Line up three in a row along any drawn line to form a MILL and remove an opposing piece — pieces already in a mill are protected while any of the opponent's pieces stand outside one.
        {variant.flyingEnabled ? " Drop to 3 pieces and you can fly anywhere." : " This ruleset has no flying phase — movement always stays to adjacent points, even down to your last 3."}
        {" "}Reduce your opponent below 3 pieces, or leave them with no legal move, to win.
      </div>
    </div>
  );
}

// ---------- Bundle shell ----------
// Phase 1 scope: just the container. No shared systems yet (freemium/Pro,
// online, rule variants) — each game below is exactly the prototype it was,
// just reachable from one entry point instead of two separate files, with
// its own back button wired in. Later phases layer real features onto
// each game individually; this component's job is only ever "which game is
// mounted right now."
function GameCard({ t, title, subtitle, blurb, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 6,
        width: "100%", maxWidth: 360, padding: "18px 20px", borderRadius: 14,
        border: `1px solid ${t.panelBorder}`, background: t.panel, cursor: "pointer",
        textAlign: "left",
      }}
    >
      <div style={{ fontSize: 11, letterSpacing: 2, color: t.muted, fontWeight: 700 }}>{subtitle}</div>
      <div style={{ fontSize: 19, fontWeight: 800, color: t.text, textTransform: "uppercase", letterSpacing: 0.5 }}>{title}</div>
      <div style={{ fontSize: 12.5, color: t.muted, lineHeight: 1.5 }}>{blurb}</div>
    </button>
  );
}

function AncientGamesBundle() {
  const [themeKey, setThemeKey] = useState("dark");
  const t = THEMES[themeKey];
  const [activeGame, setActiveGame] = useState(() => (getInviteTokenFromUrl() ? "nmm" : null)); // null | "ur" | "nmm" — auto-opens NMM if an invite link brought you here (the only game online play supports so far)

  // ---------- Bundle-wide Pro + freemium ----------
  const [isPro, setIsPro] = useState(() => !!loadProRecord());
  const [freemium, setFreemium] = useState(() => loadFreemiumState());
  const [checkoutBusy, setCheckoutBusy] = useState(false);
  const [checkoutError, setCheckoutError] = useState("");
  const [restoreEmail, setRestoreEmail] = useState("");
  const [restoreStatus, setRestoreStatus] = useState("");
  const [showRestoreForm, setShowRestoreForm] = useState(false);

  // Detect a return from Stripe checkout (?session_id=...) on load, and
  // activate Pro on THIS device if it's genuinely a paid session. Stripe's
  // {CHECKOUT_SESSION_ID} placeholder gets substituted into the redirect
  // URL automatically — see success_url in the checkout/create endpoint.
  useEffect(() => {
    const sessionId = new URLSearchParams(window.location.search).get("session_id");
    if (!sessionId) return;
    (async () => {
      try {
        const res = await bundleApiPost("/checkout/activate", { sessionId });
        if (res.activated) {
          const record = { activatedAt: Date.now(), source: "checkout" };
          writeProRecord(record);
          setIsPro(true);
        } else {
          setCheckoutError(`Payment didn't verify as complete (${res.reason || "unknown reason"}). If you were charged, use "Already purchased? Restore it" below with the email you paid with.`);
        }
      } catch (e) {
        // A failure here is quiet-by-design in one sense — it happens on
        // page load, not from a button the person just pressed, so a loud
        // error banner immediately on arrival would be jarring. But
        // "silent" should never mean "invisible everywhere" — logging it
        // means a real failure is still discoverable via DevTools instead
        // of vanishing without a trace, which is the exact mistake being
        // fixed in startCheckout() below.
        console.error("Checkout activation failed:", e);
      }
      finally {
        const url = new URL(window.location.href);
        url.searchParams.delete("session_id");
        window.history.replaceState({}, "", url.toString());
      }
    })();
  }, []);

  function recordGameCompleted(gameKey, mode) {
    setFreemium((prev) => {
      const slot = freemiumSlotKey(gameKey, mode);
      const next = { ...prev, counts: { ...prev.counts, [slot]: (prev.counts[slot] || 0) + 1 } };
      writeFreemiumState(next);
      return next;
    });
  }

  async function startCheckout() {
    setCheckoutBusy(true);
    setCheckoutError("");
    try {
      const res = await bundleApiPost("/checkout/create", {});
      window.location.href = res.url;
    } catch (e) {
      setCheckoutBusy(false);
      setCheckoutError(e.message || "Couldn't reach the payments server. Try again in a moment.");
    }
  }

  async function onSubmitRestore() {
    if (!restoreEmail) return;
    setRestoreStatus("Sending…");
    try {
      await bundleApiPost("/restore/request", { email: restoreEmail });
      setRestoreStatus("Check your email for a restore link.");
    } catch (e) {
      setRestoreStatus(e.message || "Couldn't send that — try again in a moment.");
    }
  }

  // Detect a restore-link click (?restore=TOKEN) on load, same pattern as
  // the checkout redirect above.
  useEffect(() => {
    const restoreToken = new URLSearchParams(window.location.search).get("restore");
    if (!restoreToken) return;
    (async () => {
      try {
        const res = await bundleApiPost("/restore/confirm", { token: restoreToken });
        if (res.activated) { writeProRecord({ activatedAt: Date.now(), source: "restore" }); setIsPro(true); }
      } catch (e) { /* ignore — they'll see the gate and can retry */ }
      finally {
        const url = new URL(window.location.href);
        url.searchParams.delete("restore");
        window.history.replaceState({}, "", url.toString());
      }
    })();
  }, []);

  const shared = {
    isPro, freemium, onGameCompleted: recordGameCompleted,
    onUnlock: startCheckout, unlocking: checkoutBusy, checkoutError,
    restoreEmail, setRestoreEmail, restoreStatus, onSubmitRestore, showRestoreForm, setShowRestoreForm,
  };

  if (activeGame === "ur") return <RoyalGameOfUr onBack={() => setActiveGame(null)} {...shared} />;
  if (activeGame === "nmm") return <NineMensMorris onBack={() => setActiveGame(null)} {...shared} />;

  return (
    <div style={{
      minHeight: "100vh", background: t.bg, color: t.text,
      display: "flex", flexDirection: "column", alignItems: "center", padding: "40px 20px",
      fontFamily: "system-ui, -apple-system, sans-serif",
    }}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 11, letterSpacing: 4, color: t.muted, fontWeight: 700, marginBottom: 4 }}>
          ANCIENT GAMES · 02 &amp; 03
        </div>
        <h1 style={{ fontSize: 25, fontWeight: 800, letterSpacing: 1, margin: 0, textTransform: "uppercase" }}>
          Two Ancient <span style={{ color: t.accent }}>Classics</span>
        </h1>
        <div style={{ fontSize: 11, color: t.muted, marginTop: 4, letterSpacing: 0.5 }}>
          One bundle, one Pro unlock, two genuinely different games
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10, flexWrap: "wrap", justifyContent: "center" }}>
        <button onClick={() => setThemeKey(themeKey === "light" ? "dark" : "light")} style={pillStyle(t, true)}>
          {themeKey === "light" ? "☀️ Light" : "🌙 Dark"}
        </button>
        {isPro ? (
          <span style={{ ...pillStyle(t, true), cursor: "default" }}>✓ Pro — unlimited</span>
        ) : (
          <button onClick={startCheckout} disabled={checkoutBusy} style={pillStyle(t, false)}>
            {checkoutBusy ? "Opening checkout…" : "🔓 Unlock Both — $2 USD"}
          </button>
        )}
      </div>
      {checkoutError && (
        <div style={{ fontSize: 12, color: "#ff6b5b", maxWidth: 300, textAlign: "center", marginBottom: 24 }}>{checkoutError}</div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%", alignItems: "center" }}>
        <GameCard
          t={t}
          subtitle="ANCIENT GAMES · 02"
          title="Royal Game of Ur"
          blurb="Race 7 pieces along the sacred path, 2600 BC Mesopotamia. Four dice, five rosettes, one ancient grudge match."
          onClick={() => setActiveGame("ur")}
        />
        <GameCard
          t={t}
          subtitle="ANCIENT GAMES · 03"
          title="Nine Men's Morris"
          blurb="Pure strategy, no luck. Form mills to capture, survive down to three pieces and start flying."
          onClick={() => setActiveGame("nmm")}
        />
      </div>

      <div style={{ fontSize: 10, color: t.muted, marginTop: 32, textAlign: "center", maxWidth: 340, lineHeight: 1.6 }}>
        {isPro
          ? "Pro unlocked — unlimited games in both titles, no daily limits."
          : `${FREE_GAMES_PER_MODE_PER_DAY} free games per mode per day, in each game. One $2 USD purchase removes the cap in both.`}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AncientGamesBundle />);
</script>
</body>
</html>
