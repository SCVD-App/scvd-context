// ---------- Bundle-wide freemium + Pro ----------
// One Pro purchase ($2, "two games for the price of one") unlocks BOTH
// games — matches the pricing call already made. Quota shape is a direct
// copy of Hnefatafl's own pattern: 3 free games per (game × mode) per day,
// device-local midnight reset, only a GENUINE completed game counts
// (starting then abandoning/resetting never burns a slot). This lives at
// the shell level, not inside either game component, since both the quota
// and the Pro flag are bundle-wide, not per-game.
const FREE_GAMES_PER_MODE_PER_DAY = 3;
const FREEMIUM_KEY = "ancient_games_bundle_freemium_v1";
const PRO_KEY = "ancient_games_bundle_pro_v1";

function todayLocalKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function freemiumSlotKey(gameKey, mode) { return `${gameKey}:${mode}`; }

function loadFreemiumState() {
  const today = todayLocalKey();
  try {
    const raw = localStorage.getItem(FREEMIUM_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (!parsed || parsed.date !== today) return { date: today, counts: {} };
    return { date: today, counts: parsed.counts || {} };
  } catch (e) {
    return { date: today, counts: {} };
  }
}
function writeFreemiumState(state) {
  try { localStorage.setItem(FREEMIUM_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
function isQuotaExhausted(freemium, gameKey, mode) {
  const count = freemium.counts[freemiumSlotKey(gameKey, mode)] || 0;
  return count >= FREE_GAMES_PER_MODE_PER_DAY;
}

function loadProRecord() {
  try {
    const raw = localStorage.getItem(PRO_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeProRecord(record) {
  try { localStorage.setItem(PRO_KEY, JSON.stringify(record)); } catch (e) { /* ignore */ }
}

// ---------- Board geometry ----------
// 3 rows x 8 cols, with the top-right and bottom-right 2x2 blocks cut away —
// the classic 20-square Ur board shape.
const ROWS = 3, COLS = 8;
function squareExists(r, c) {
  if (r === 1) return true; // shared middle row is full width
  return c <= 3 || c >= 6; // private rows have a gap at columns 4-5
}
const ALL_SQUARES = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (squareExists(r, c)) ALL_SQUARES.push({ r, c });

// Path each side's pieces travel: 4 private squares, 8 shared, 2 private-end.
// Index 0-13 = on board, index 14 = borne off (finished).
const PATH_YOU = [
  { r: 0, c: 0 }, { r: 0, c: 1 }, { r: 0, c: 2 }, { r: 0, c: 3 },
  { r: 1, c: 0 }, { r: 1, c: 1 }, { r: 1, c: 2 }, { r: 1, c: 3 }, { r: 1, c: 4 }, { r: 1, c: 5 }, { r: 1, c: 6 }, { r: 1, c: 7 },
  { r: 0, c: 6 }, { r: 0, c: 7 },
];
const PATH_CPU = [
  { r: 2, c: 0 }, { r: 2, c: 1 }, { r: 2, c: 2 }, { r: 2, c: 3 },
  { r: 1, c: 0 }, { r: 1, c: 1 }, { r: 1, c: 2 }, { r: 1, c: 3 }, { r: 1, c: 4 }, { r: 1, c: 5 }, { r: 1, c: 6 }, { r: 1, c: 7 },
  { r: 2, c: 6 }, { r: 2, c: 7 },
];
const PATH_LEN = 14;

// The five rosette squares — safe from capture, and grant an extra roll.
// Exact ancient rosette placement is one of the disputed details (even the
// historians don't fully agree — see the note in-app) so this is the
// commonly used modern reconstruction, not a certified original layout.
const ROSETTES = new Set(["0,3", "2,3", "1,3", "0,7", "2,7"]);
function key(r, c) { return `${r},${c}`; }
function isRosette(r, c) { return ROSETTES.has(key(r, c)); }
function isShared(r) { return r === 1; }

// Start/finish squares per path — used to give each player's lane a clear
// visual "run" instead of an arrow. Finish squares happen to also be
// rosette squares in this layout (safe + extra roll AND the exit square),
// so the finish marker takes visual priority over the plain rosette star.
const YOU_START = key(PATH_YOU[0].r, PATH_YOU[0].c);
const YOU_FINISH = key(PATH_YOU[13].r, PATH_YOU[13].c);
const CPU_START = key(PATH_CPU[0].r, PATH_CPU[0].c);
const CPU_FINISH = key(PATH_CPU[13].r, PATH_CPU[13].c);
function squareRole(r, c) {
  const k = key(r, c);
  if (k === YOU_START) return "you-start";
  if (k === YOU_FINISH) return "you-finish";
  if (k === CPU_START) return "cpu-start";
  if (k === CPU_FINISH) return "cpu-finish";
  return null;
}

// Step numbers (1-14) per square, for the route-numbering overlay. The
// shared middle row has the same number for both paths since both players
// cross the exact same squares there in the same order.
const YOU_INDEX = new Map(PATH_YOU.map((s, i) => [key(s.r, s.c), i + 1]));
const CPU_INDEX = new Map(PATH_CPU.map((s, i) => [key(s.r, s.c), i + 1]));
function stepNumber(r, c) {
  if (r === 0) return YOU_INDEX.get(key(r, c));
  if (r === 2) return CPU_INDEX.get(key(r, c));
  return YOU_INDEX.get(key(r, c)); // shared row — same number either way
}

// ---------- Ur rule variants ----------
// Two genuinely documented historical forks, not invented for symmetry
// with Hnefatafl's variant picker:
//   Finkel — the commonly-played reconstruction from the 177 BC Babylonian
//     tablet Irving Finkel translated. 4 binary dice (roll 0-4), rosettes
//     are safe from capture and grant an extra roll, rolling 0 is a miss.
//   Masters — James Masters' alternative reading of the same evidence. 3
//     binary dice, and rolling all-blank (which would be "0") is
//     specifically re-read as a move of 4 rather than a miss turn.
//     Rosettes are NOT safe under these rules — removing rosette safety
//     is the deliberate strategic change Masters argued for.
// NOT implemented here: Masters' proposed longer path with rosettes every
// 4th square. That's a genuine physical board-geometry change, not a data
// flag, and I'm not confident enough in the exact reconstructed layout
// from secondary sources alone to ship it under a game that markets
// itself on rules accuracy. Worth a dedicated pass with a primary source
// if this matters later — flagged, not silently skipped.
const UR_VARIANTS = {
  finkel: {
    key: "finkel", name: "Finkel", subtitle: "4 dice · rosettes safe",
    diceCount: 4, zeroIsMiss: true, rosettesSafe: true,
  },
  masters: {
    key: "masters", name: "Masters", subtitle: "3 dice · rosettes exposed",
    diceCount: 3, zeroIsMiss: false, rosettesSafe: false,
  },
};
const UR_DEFAULT_VARIANT_KEY = "finkel";

// sum of marked dice (0..diceCount) -> the actual move distance this turn.
function resolveRollValue(sum, variant) {
  if (sum === 0) return variant.zeroIsMiss ? 0 : 4;
  return sum;
}

// Exact probability distribution over resolved roll values, for the AI's
// chance nodes — binomial(diceCount, 0.5) collapsed through
// resolveRollValue. Small enough (≤5 entries) to just recompute each call
// rather than cache.
function urRollDistribution(variant) {
  const n = variant.diceCount;
  const binom = (k) => { let c = 1; for (let i = 0; i < k; i++) c = (c * (n - i)) / (i + 1); return c; };
  const total = 2 ** n;
  const dist = new Map();
  for (let sum = 0; sum <= n; sum++) {
    const p = binom(sum) / total;
    const rollValue = resolveRollValue(sum, variant);
    dist.set(rollValue, (dist.get(rollValue) || 0) + p);
  }
  return dist;
}

// ---------- Pure move engine (shared by the UI and the AI search — same
// principle as Hnefatafl's rule functions: the AI can never see a
// different game than a human actually plays) ----------
function urOccupancy(youPos, cpuPos) {
  const map = new Map();
  youPos.forEach((p, i) => { if (p >= 0 && p < 14) { const sq = PATH_YOU[p]; map.set(key(sq.r, sq.c), { side: "you", idx: i }); } });
  cpuPos.forEach((p, i) => { if (p >= 0 && p < 14) { const sq = PATH_CPU[p]; map.set(key(sq.r, sq.c), { side: "cpu", idx: i }); } });
  return map;
}

function urLegalMoves(youPos, cpuPos, side, roll, variant) {
  if (!roll) return [];
  const pos = side === "you" ? youPos : cpuPos;
  const path = side === "you" ? PATH_YOU : PATH_CPU;
  const occ = urOccupancy(youPos, cpuPos);
  const moves = [];
  pos.forEach((cur, idx) => {
    if (cur === 14) return;
    const dest = cur + roll;
    if (dest > 14) return;
    if (dest === 14) { moves.push({ pieceIdx: idx, from: cur, to: 14, captures: false }); return; }
    const sq = path[dest];
    const o = occ.get(key(sq.r, sq.c));
    if (o && o.side === side) return;
    if (o && o.side !== side) {
      if (variant.rosettesSafe && isRosette(sq.r, sq.c)) return;
      moves.push({ pieceIdx: idx, from: cur, to: dest, captures: true });
      return;
    }
    moves.push({ pieceIdx: idx, from: cur, to: dest, captures: false });
  });
  return moves;
}

// Applies a move immutably, resolving capture from the PRE-move occupancy
// (not post-move) — computing occupancy after already writing the mover's
// new position would have the mover and the piece it's capturing briefly
// claim the same square, and depending on array-iteration order one could
// silently overwrite the other in the lookup. Resolving from pre-move
// state sidesteps that entirely.
function urApplyMove(youPos, cpuPos, side, move) {
  const path = side === "you" ? PATH_YOU : PATH_CPU;
  const preOcc = urOccupancy(youPos, cpuPos);
  const nextYou = youPos.slice(), nextCpu = cpuPos.slice();
  if (move.captures && move.to < 14) {
    const sq = path[move.to];
    const occ = preOcc.get(key(sq.r, sq.c));
    if (occ) {
      const arr = occ.side === "you" ? nextYou : nextCpu;
      arr[occ.idx] = -1;
    }
  }
  const mover = side === "you" ? nextYou : nextCpu;
  mover[move.pieceIdx] = move.to;
  const landedRosette = move.to < 14 && isRosette(path[move.to].r, path[move.to].c);
  return { youPos: nextYou, cpuPos: nextCpu, landedRosette, wentHome: move.to === 14 };
}

// ---------- AI: expectiminimax ----------
// Ur has real randomness (the dice), so a plain minimax like Hnefatafl's
// isn't honest here — it would implicitly assume the opponent's future
// rolls are whatever's worst-case for them, which isn't how the game
// works. Expectiminimax alternates: a decision node (pick the best move
// for a KNOWN roll) with a chance node (average over the probability-
// weighted outcomes of the NEXT roll) before the next decision. Depth is
// spent once per decision→chance transition, which also correctly covers
// "no legal move" turns (auto-pass) — every recursive path is guaranteed
// to hit the depth<=0 base case, since depth only ever holds steady
// within a single decision node's move loop and always decrements when
// crossing into the next chance node.
const UR_SEARCH_DEPTH = 3; // tuning knob, same spirit as Hnefatafl's AI_DEPTH — drop to 2 first if it ever feels sluggish on a real device

function evaluateUrPosition(youPos, cpuPos, aiSide) {
  const aiPos = aiSide === "you" ? youPos : cpuPos;
  const oppPos = aiSide === "you" ? cpuPos : youPos;
  const aiHome = aiPos.filter((p) => p === 14).length;
  const oppHome = oppPos.filter((p) => p === 14).length;
  if (aiHome >= 7) return 100000;
  if (oppHome >= 7) return -100000;
  let score = (aiHome - oppHome) * 60;
  aiPos.forEach((p) => { if (p >= 0 && p < 14) score += p + 1; });
  oppPos.forEach((p) => { if (p >= 0 && p < 14) score -= p + 1; });
  return score;
}

function urChanceNode(youPos, cpuPos, side, depth, aiSide, variant) {
  const dist = urRollDistribution(variant);
  let expected = 0;
  for (const [rollValue, prob] of dist) {
    if (rollValue === 0) {
      // A miss — no decision to make, turn passes outright. Still spends
      // depth (see comment above): without this, an unlucky run of zero
      // rolls in the exact-probability sum (not a simulation — every
      // branch really is walked) would recurse forever chasing an
      // ever-smaller-probability tail.
      expected += prob * (depth <= 0
        ? evaluateUrPosition(youPos, cpuPos, aiSide)
        : urChanceNode(youPos, cpuPos, side === "you" ? "cpu" : "you", depth - 1, aiSide, variant));
    } else {
      expected += prob * urDecisionNode(youPos, cpuPos, side, rollValue, depth, aiSide, variant);
    }
  }
  return expected;
}

function urDecisionNode(youPos, cpuPos, side, rollValue, depth, aiSide, variant) {
  const moves = urLegalMoves(youPos, cpuPos, side, rollValue, variant);
  if (moves.length === 0) {
    return depth <= 0
      ? evaluateUrPosition(youPos, cpuPos, aiSide)
      : urChanceNode(youPos, cpuPos, side === "you" ? "cpu" : "you", depth - 1, aiSide, variant);
  }
  const maximizing = side === aiSide;
  let best = maximizing ? -Infinity : Infinity;
  for (const move of moves) {
    const result = urApplyMove(youPos, cpuPos, side, move);
    const homeCount = (side === "you" ? result.youPos : result.cpuPos).filter((p) => p === 14).length;
    let val;
    if (homeCount >= 7) {
      val = side === aiSide ? 100000 + depth : -100000 - depth;
    } else if (result.landedRosette) {
      val = depth <= 0
        ? evaluateUrPosition(result.youPos, result.cpuPos, aiSide)
        : urChanceNode(result.youPos, result.cpuPos, side, depth - 1, aiSide, variant); // same side rolls again
    } else {
      val = depth <= 0
        ? evaluateUrPosition(result.youPos, result.cpuPos, aiSide)
        : urChanceNode(result.youPos, result.cpuPos, side === "you" ? "cpu" : "you", depth - 1, aiSide, variant);
    }
    if (maximizing ? val > best : val < best) best = val;
  }
  return best;
}

function chooseUrAiMove(youPos, cpuPos, aiSide, rollValue, variant, depth = UR_SEARCH_DEPTH) {
  const moves = urLegalMoves(youPos, cpuPos, aiSide, rollValue, variant);
  if (moves.length === 0) return null;
  let bestMove = moves[0], bestVal = -Infinity;
  for (const move of moves) {
    const result = urApplyMove(youPos, cpuPos, aiSide, move);
    const homeCount = (aiSide === "you" ? result.youPos : result.cpuPos).filter((p) => p === 14).length;
    let val;
    if (homeCount >= 7) {
      val = 100000 + depth;
    } else if (result.landedRosette) {
      val = depth <= 0
        ? evaluateUrPosition(result.youPos, result.cpuPos, aiSide)
        : urChanceNode(result.youPos, result.cpuPos, aiSide, depth - 1, aiSide, variant);
    } else {
      val = depth <= 0
        ? evaluateUrPosition(result.youPos, result.cpuPos, aiSide)
        : urChanceNode(result.youPos, result.cpuPos, aiSide === "you" ? "cpu" : "you", depth - 1, aiSide, variant);
    }
    if (val > bestVal) { bestVal = val; bestMove = move; }
  }
  return bestMove;
}

// ---------- Intro crawl ----------
// Ported verbatim from Hnefatafl — same component, same timing, same
// runic motto and SCVD.app brand mark (deliberately fixed series
// branding, not per-game content, per the original comment in that file).
// Only the per-game props (seriesLabel/gameTitle/gameTagline/crawlText)
// and the INTRO_SEEN_KEY differ below, once per game — plus
// crawlDurationMs, which controls READING SPEED (how fast the text
// scrolls by). The DISTANCE the crawl needs to travel to actually clear
// the screen is measured from the real rendered text below, not guessed —
// see the crawlDistancePx logic in the component itself. crawlDurationMs
// is still worth setting per-game so a longer crawl doesn't fly past too
// fast to read; 26000ms was the value tuned for Hnefatafl's 724-character
// crawl, and Ur's/NMM's/Jumpin' Pin's longer ones each get their own
// slower value, scaled to roughly the same characters-per-second rate.
const TITLE_CARD_MS = 3500;
const CRAWL_DURATION_MS = 26000; // default, used if a game doesn't pass its own crawlDurationMs
const CRAWL_FADE_OVERLAP_MS = 3000;
const MOTTO_MS = 7000;
const BRAND_MS = 4000;

function IntroCrawl({ seriesLabel, gameTitle, gameTagline, crawlText, motto, mottoFont, mottoFontSize, crawlDurationMs, onDone }) {

  const brandDelayMs = mottoDelayMs + MOTTO_MS;

  // The crawl block starts with its TOP edge at the bottom of the screen
  // (top: 100%) and travels upward. For it to actually clear the screen,
  // it has to travel far enough that its own BOTTOM edge — which starts
  // one whole block-height further down, off-screen — passes the top of
  // the viewport too. That distance is (viewport height + block height),
  // not a flat guess. -170vh was tuned by eye against Hnefatafl's
  // specific crawl and quietly stopped being enough the moment any other
  // game's text ran longer — worse, giving it more TIME to travel that
  // same fixed distance (the fix tried last time) only made it crawl
  // slower over the same too-short trip, it never actually went any
  // further. Measuring the real rendered height here instead means this
  // can't recur for any future game's crawl, however long.
  const crawlRef = useRef(null);
  const [crawlDistancePx, setCrawlDistancePx] = useState(() => (typeof window !== "undefined" ? window.innerHeight * 1.7 : 1200));
  useEffect(() => {

  useEffect(() => {
    const timer = setTimeout(onDone, introTotalMs);

        color: "#ece7da", fontSize: 12, fontWeight: 700, letterSpacing: 1,

      }}>

      <div style={{
        position: "absolute", inset: 0, display: "flex", flexDirection: "column",

        animation: `introTitleFade ${TITLE_CARD_MS}ms ease forwards`,

        <div style={{ fontSize: 12, letterSpacing: 5, color: "#8b9a97", fontWeight: 700, marginBottom: 10 }}>
          {seriesLabel}
        </div>
        <div style={{ fontFamily: "Georgia, serif", fontWeight: 900, fontSize: 40, color: "#e8c468", textShadow: "0 0 28px rgba(232,196,104,0.6)", letterSpacing: 2 }}>
          {gameTitle}
        </div>
        {gameTagline && (

        )}

      <div style={{ position: "absolute", inset: 0, perspective: "450px", overflow: "hidden" }}>
        <div style={{
          position: "absolute", bottom: 0, left: 0, right: 0, height: "100%",
          transformOrigin: "50% 100%", transform: "rotateX(33deg)",
        }}>
          <div ref={crawlRef} style={{
            position: "absolute", left: "50%", top: "100%", width: "92%", maxWidth: 560,
            animation: `crawlUp ${crawlMs}ms linear forwards`,

      <div style={{
        position: "absolute", inset: 0, display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", textAlign: "center", padding: "0 30px",
        opacity: 0, animation: `mottoFade ${MOTTO_MS}ms ease forwards`,
        animationDelay: `${mottoDelayMs}ms`,
      }}>

          <React.Fragment key={i}>

          ᛋᚴᚢᛏ ᛫ ᚬᛒᛒ
        </div>
        <div style={{ fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: 24, color: "#8b9a97", marginTop: 8 }}>
          (scvd.app)
        </div>
      </div>

      <style>{`
        @keyframes introTitleFade {
          0% { opacity: 0; transform: scale(0.88); }
          12% { opacity: 1; transform: scale(1); }
          78% { opacity: 1; transform: scale(1); }
          100% { opacity: 0; transform: scale(1.12); }
        }
        @keyframes crawlUp {
          0% { transform: translateX(-50%) translateY(0); opacity: 1; }
          88% { opacity: 1; }
          100% { transform: translateX(-50%) translateY(-${crawlDistancePx}px); opacity: 0; }
        }
        @keyframes mottoFade {
          0% { opacity: 0; }
          14% { opacity: 1; }
          86% { opacity: 1; }
          100% { opacity: 0; }
        }
        @keyframes brandFade {
          0% { opacity: 0; }
          16% { opacity: 1; }
          82% { opacity: 1; }

// Historically checked against multiple sources rather than composed from
// memory — the Finkel/tablet nuance in particular (the 177 BC tablet is
// NOT a direct transcription of Ur's original rules; Finkel's reconstruction
// draws on it plus the board's own shape and rosette symbolism) is stated
// carefully rather than overclaimed.
const UR_CRAWL = [
  "Nearly 4,600 years ago, in the Sumerian city of Ur — long before Rome, long before Greece — a game was already old.",
  "Kings and commoners alike raced seven pieces of shell and bone across twenty squares inlaid with lapis lazuli.",
  "For three thousand years it was played across the ancient world. Then, for nearly two thousand more, it was entirely forgotten.",
  "In 1922, archaeologist Leonard Woolley began digging into the Royal Tombs of Ur — and found the boards. Nobody alive could read how to play them.",
  "The answer came from somewhere stranger still: a Babylonian tablet, written in 177 BC — over two thousand years after the boards themselves were buried.",
  "British Museum curator Irving Finkel spent decades piecing the rules back together, from that tablet and from the board's own telltale shape.",
  "The dice are rolling again. The rosette — sacred to Ishtar herself — still watches over the middle row.",
];

// The Kurna dating below is stated with its real caveat (Berger's Coptic-
// cross objection), same honesty standard as everywhere else in this
// build — not smoothed over for a punchier line.
const NMM_CRAWL = [
  "Twenty-four points. Three concentric squares. Not a single die in sight — Nine Men's Morris may be the oldest surviving game of pure strategy on Earth.",
  "The earliest known board is carved into the roofing slabs of a temple at Kurna, Egypt — cut by workers' hands some 3,400 years ago.",
  "Even that claim has its skeptics: a few of the Kurna markings carry symbols added centuries later, so no one can date them with total certainty.",
  "What's beyond doubt is the game's spread — Roman legionaries carved it into barracks floors and fort stones from Egypt to the wind-battered edge of Britain.",
  "The Romans called it merels, after merellus — a humble word for \"gaming piece.\"",
  "By Shakespeare's day it was common enough that Titania complains the flooded fields have left \"the nine men's morris... filled up with mud.\"",
  "No dice. No luck. Just you, your opponent, and the mill.",
];

function RoyalGameOfUr({ onBack, isPro, freemium, onGameCompleted, onUnlock, unlocking, checkoutError, restoreEmail, setRestoreEmail, restoreStatus, onSubmitRestore, showRestoreForm, setShowRestoreForm }) {
  const GAME_KEY = "ur";
  const UR_INTRO_SEEN_KEY = "ancient_games_intro_seen_ur_v1";
  const [showIntro, setShowIntro] = useState(() => {
    try { return localStorage.getItem(UR_INTRO_SEEN_KEY) !== "1"; } catch (e) { return true; }
  });
  function dismissIntro() {
    try { localStorage.setItem(UR_INTRO_SEEN_KEY, "1"); } catch (e) { /* ignore */ }
    setShowIntro(false);
  }
  const [themeKey, setThemeKey] = useState("dark");
  const t = THEMES[themeKey];
  const [upsell, setUpsell] = useState(null);
  function selectTheme(key) {
    const theme = THEMES[key];
    if (theme.tier === "pro" && !isPro) {
      setUpsell(theme.name);
      setTimeout(() => setUpsell(null), 2200);
      return;
    }
    setThemeKey(key);
  }
  const [mode, setMode] = useState("challenge"); // "play" (hotseat) | "challenge" (vs AI)
  const [variantKey, setVariantKey] = useState(UR_DEFAULT_VARIANT_KEY);
  const variant = UR_VARIANTS[variantKey];
  const [gateActive, setGateActive] = useState(() => !isPro && isQuotaExhausted(freemium, GAME_KEY, "challenge"));
  const wonRef = useRef(false); // tracks a genuine null->non-null winner transition, so a completed game is only ever counted once

  // Turn-side labels swap depending on mode — "You"/"CPU" only make sense
  // when one side really is an AI. In hotseat Play, both are humans taking
  // turns on the same device, same convention as Hnefatafl's Play mode.
  function sideLabel(side) {
    if (mode === "play") return side === "you" ? "Player 1" : "Player 2";
    return side === "you" ? "You" : "CPU";
  }

  // Board sizing — same responsive-width approach as Jumpin' Pin.
  const PAD = 26, MIN_CELL = 34, MAX_CELL = 56, MAX_BOARD_WIDTH = 560;
  const [viewportWidth, setViewportWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 390);
  useEffect(() => {
    const onResize = () => setViewportWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const CELL = useMemo(() => {
    const usableWidth = Math.min(viewportWidth - 24, MAX_BOARD_WIDTH);
    const raw = (usableWidth - PAD * 2) / (COLS - 1);
    return Math.max(MIN_CELL, Math.min(MAX_CELL, raw));
  }, [viewportWidth]);
  const boardWidth = (COLS - 1) * CELL + PAD * 2;
  const boardHeight = (ROWS - 1) * CELL + PAD * 2;

  // ---------- Game state ----------
  // youPos / cpuPos: array of 7 entries, each -1 (in hand), 0-13 (on board
  // at that path index), or 14 (borne off / home). Piece count (7) and the
  // path itself are the same in both rule variants — only dice count,
  // zero-roll handling, and rosette safety differ (see UR_VARIANTS).
  const [youPos, setYouPos] = useState(() => Array(7).fill(-1));
  const [cpuPos, setCpuPos] = useState(() => Array(7).fill(-1));
  const [turn, setTurn] = useState("you"); // "you" | "cpu"
  const [dice, setDice] = useState(null); // array of booleans (length = variant.diceCount), or null if not rolled yet
  const [rollValue, setRollValue] = useState(null);
  const [message, setMessage] = useState("Roll to begin.");
  const [winner, setWinner] = useState(null); // "you" | "cpu" | null
  const [rolling, setRolling] = useState(false);
  const [rollPopKey, setRollPopKey] = useState(0);
  const [rosettePopKey, setRosettePopKey] = useState(0);
  const [homePop, setHomePop] = useState(null); // { side, key } | null
  const [bearOffGlow, setBearOffGlow] = useState(null); // { side, key } | null
  const cpuTimer = useRef(null);

  const youHome = youPos.filter((p) => p === 14).length;
  const cpuHome = cpuPos.filter((p) => p === 14).length;
  const youInHand = youPos.filter((p) => p === -1).length;
  const cpuInHand = cpuPos.filter((p) => p === -1).length;

  // Occupancy lookup for the board's real squares (not path index — actual r,c).
  const occupancy = useMemo(() => urOccupancy(youPos, cpuPos), [youPos, cpuPos]);

  // Legal moves — thin wrapper over the shared pure engine (urLegalMoves),
  // so the UI and the AI search can never disagree about what's legal.
  const legalMoves = useCallback((side, roll) => urLegalMoves(youPos, cpuPos, side, roll, variant), [youPos, cpuPos, variant]);

  const currentLegalMoves = useMemo(() => legalMoves(turn, rollValue), [legalMoves, turn, rollValue]);

  const rollDice = useCallback(() => {
    if (winner || rolling || dice !== null) return;
    setRolling(true);
    setMessage("Rolling…");
    let ticks = 0;
    const spin = setInterval(() => {
      setDice(Array.from({ length: variant.diceCount }, () => Math.random() < 0.5));
      ticks++;
      if (ticks > 6) {
        clearInterval(spin);
        const final = Array.from({ length: variant.diceCount }, () => Math.random() < 0.5);
        const sum = final.filter(Boolean).length;
        const value = resolveRollValue(sum, variant);
        setDice(final);
        setRollValue(value);
        setRolling(false);
        setRollPopKey((k) => k + 1);
      }
    }, 80);
  }, [winner, rolling, dice, variant]);

  // After a roll lands, check whether the mover actually has any legal move.
  useEffect(() => {
    if (rollValue === null || rolling) return;
    const moves = legalMoves(turn, rollValue);
    if (rollValue === 0) {
      setMessage(`${sideLabel(turn)} rolled 0 — turn passes.`);
      const t2 = setTimeout(() => passTurn(), 900);
      return () => clearTimeout(t2);
    }
    if (moves.length === 0) {
      setMessage(`Rolled ${rollValue} — no legal move. Turn passes.`);
      const t2 = setTimeout(() => passTurn(), 900);
      return () => clearTimeout(t2);
    }
    setMessage(
      mode === "play" || turn === "you"
        ? `${sideLabel(turn)} rolled ${rollValue} — pick a piece to move.`
        : `${sideLabel(turn)} rolled ${rollValue}…`
    );
    // eslint-disable-next-line
  }, [rollValue, rolling, mode]);

  function passTurn() {
    setDice(null);
    setRollValue(null);
    setTurn((tn) => (tn === "you" ? "cpu" : "you"));
  }

  function applyMove(side, move) {
    const setPos = side === "you" ? setYouPos : setCpuPos;
    const path = side === "you" ? PATH_YOU : PATH_CPU;
    setPos((prev) => {
      const next = [...prev];
      next[move.pieceIdx] = move.to;
      return next;
    });
    if (move.captures && move.to < 14) {
      const sq = path[move.to];
      const occ = occupancy.get(key(sq.r, sq.c));
      if (occ) {
        const setOther = occ.side === "you" ? setYouPos : setCpuPos;
        setOther((prev) => { const next = [...prev]; next[occ.idx] = -1; return next; });
      }
    }
    const landedRosette = move.to < 14 && isRosette(path[move.to].r, path[move.to].c);

    if (move.to === 14) {
      setBearOffGlow({ side, key: Date.now() });
      setTimeout(() => setBearOffGlow(null), 1300);
      setHomePop({ side, key: Date.now() + 1 });
      setTimeout(() => setHomePop(null), 1300);
    }

    // Win check happens after state settles — checked in an effect below via
    // a small delay so the board visibly shows the final piece first.
    setTimeout(() => {
      const willBeHome = (side === "you" ? youHome : cpuHome) + (move.to === 14 ? 1 : 0);
      if (willBeHome >= 7) {
        setWinner(side);
        setMessage(
          mode === "play"
            ? `${sideLabel(side)} brought all pieces home!`
            : side === "you" ? "You've brought all your pieces home!" : "The computer got all its pieces home first."
        );
        return;
      }
      if (landedRosette) {
        setMessage("Landed on a rosette — extra roll!");
        setRosettePopKey((k) => k + 1);
        setDice(null);
        setRollValue(null);
      } else {
        passTurn();
      }
    }, 250);
  }

  function handlePieceClick(side, idx) {
    if (winner || side !== turn || rollValue === null || rolling) return;
    // In Challenge mode the CPU's own pieces are never human-clickable,
    // even during its own turn — closes a real gap in the original
    // prototype where nothing stopped a stray tap on a CPU piece from
    // hijacking its move out from under the AI's own scheduled decision.
    if (mode === "challenge" && side !== "you") return;
    const move = currentLegalMoves.find((m) => m.pieceIdx === idx);
    if (!move) return;
    applyMove(side, move);
  }

  // ---------- CPU opponent (Challenge mode only) ----------
  // Real expectiminimax search now (see UR_VARIANTS block above) — no
  // dice-cheating, the CPU rolls the same random dice you do, same as the
  // heuristic version before it. What changed is move *selection*: instead
  // of a hand-tuned priority list, it now actually looks ahead through the
  // probability-weighted space of future rolls.
  useEffect(() => {
    if (mode !== "challenge") return;
    if (turn !== "cpu" || winner) return;
    if (dice === null && !rolling) {
      const t1 = setTimeout(() => rollDice(), 600);
      cpuTimer.current = t1;
      return () => clearTimeout(t1);
    }
    if (rollValue !== null && !rolling) {
      const moves = urLegalMoves(youPos, cpuPos, "cpu", rollValue, variant);
      if (moves.length === 0) return; // the pass-turn effect handles this
      const best = chooseUrAiMove(youPos, cpuPos, "cpu", rollValue, variant);
      if (!best) return;
      const t2 = setTimeout(() => applyMove("cpu", best), 700);
      return () => clearTimeout(t2);
    }
    // eslint-disable-next-line
  }, [mode, turn, dice, rollValue, rolling, winner, variant]);

  const reset = useCallback(() => {
    setYouPos(Array(7).fill(-1));
    setCpuPos(Array(7).fill(-1));
    setTurn("you");
    setDice(null);
    setRollValue(null);
    setWinner(null);
    setMessage("Roll to begin.");
    setRolling(false);
    wonRef.current = false;
  }, []);

  // Every "start a fresh game" action (mode switch, ruleset switch, the
  // Reset/Play Again button) routes through this instead of calling reset()
  // directly — same principle as Hnefatafl's freemium gate: the quota is
  // checked at the moment a NEW game would begin, never mid-game, and Pro
  // bypasses it entirely.
  function startFreshGame(nextMode) {
    if (!isPro && isQuotaExhausted(freemium, GAME_KEY, nextMode)) { setGateActive(true); return; }
    setGateActive(false);
    reset();
  }
  function handleSetMode(next) { setMode(next); startFreshGame(next); }
  function handleSetVariantKey(next) { setVariantKey(next); startFreshGame(mode); }

  // Counts a genuinely completed game toward the quota — never a resumed
  // or abandoned one. wonRef starts false and is only ever flipped true by
  // this exact transition, then reset back to false by reset() itself, so
  // a single game can never be counted twice.
  useEffect(() => {
    if (winner && !wonRef.current) {
      wonRef.current = true;
      onGameCompleted(GAME_KEY, mode);
    }
  }, [winner, mode]);

  const legalPieceIdxSet = useMemo(() => new Set(currentLegalMoves.map((m) => m.pieceIdx)), [currentLegalMoves]);
  const legalDestSet = useMemo(() => {
    const s = new Set();
    currentLegalMoves.forEach((m) => {
      if (m.to === 14) return;
      const path = turn === "you" ? PATH_YOU : PATH_CPU;
      const sq = path[m.to];
      s.add(key(sq.r, sq.c));
    });
    return s;
  }, [currentLegalMoves, turn]);

  if (gateActive) {
    return (
      <FreemiumGate
        t={t} gameLabel="Royal Game of Ur" modeLabel={mode === "play" ? "Play" : "Challenge"} onBack={onBack}
        onUnlock={onUnlock} unlocking={unlocking} checkoutError={checkoutError}
        restoreEmail={restoreEmail} setRestoreEmail={setRestoreEmail} restoreStatus={restoreStatus}
        onSubmitRestore={onSubmitRestore} showRestoreForm={showRestoreForm} setShowRestoreForm={setShowRestoreForm}
      />
