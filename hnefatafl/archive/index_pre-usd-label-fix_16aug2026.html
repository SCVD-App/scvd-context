                width: "92%", height: "92%", borderRadius: 4,
                background: restricted ? t.restricted : "transparent",
                boxShadow: isDest ? `inset 0 0 0 2px ${t.accent}` : isLastMove ? "inset 0 0 0 2px #e8c468" : "none",
                display: "flex", alignItems: "center", justifyContent: "center", position: "relative",
              }}>
                {restricted && !piece && (
                  <span style={{ fontSize: size * 0.5, opacity: 0.6 }}>{isCorner(r, c) ? "◆" : "♛"}</span>
                )}
                {piece && (
                  <div style={{
                    width: pieceIsKing ? size * 1.15 : size, height: pieceIsKing ? size * 1.15 : size, borderRadius: "50%",
                    background: pieceIsKing
                      ? `radial-gradient(circle at 35% 30%, ${KING_FROM}, ${KING_TO})`
                      : pieceSide === "att"
                      ? `radial-gradient(circle at 35% 30%, ${t.pegFrom}, ${t.pegTo})`
                      : `radial-gradient(circle at 35% 30%, ${DEF_FROM}, ${DEF_TO})`,
                    boxShadow: isSelected
                      ? `0 0 0 3px ${t.accent}, 0 2px 4px rgba(0,0,0,0.5)`
                      : pieceIsKing
                      ? "0 0 0 2px #ffffff, 0 0 10px rgba(255,233,176,0.8), 0 2px 4px rgba(0,0,0,0.5)"
                      : "0 2px 3px rgba(0,0,0,0.5)",
                    transform: isSelected ? "scale(1.12)" : "scale(1)",
                    transition: "transform 120ms ease, box-shadow 120ms ease",
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    {pieceIsKing && (
                      <span style={{ fontSize: size * 0.62, lineHeight: 1, filter: "drop-shadow(0 1px 1px rgba(0,0,0,0.6))" }}>♛</span>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      </BoardFrame>
      </RunicFrame>
      </OuterRopeFrame>

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={challengeReset} style={btnStyle(t, false)}>🔄 Reset</button>
      </div>

      {challengeWinner && (
        <div style={{ marginTop: 18, textAlign: "center", padding: "14px 20px", borderRadius: 12, background: t.panel, border: `1px solid ${t.panelBorder}`, maxWidth: 320 }}>
          <div style={{ fontSize: 12, letterSpacing: 2, color: t.muted, marginBottom: 4 }}>GAME OVER</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: t.accent, marginBottom: 6 }}>
            {challengeWinner === humanSide ? "You win!" : "The AI wins."}
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 8, flexWrap: "wrap" }}>
            <button onClick={challengeReset} style={btnStyle(t, false, true)}>Play Again</button>
            {challengeWinner === humanSide && (
              <button onClick={() => handleShareVictory(
                challengeWinner,
                `AI defeated → ${challengeMoveCount} moves as the ${challengeWinner === "att" ? "Muscovites" : "Swedes"}`,
                `${sideTitle(challengeWinner)} · AI Slayer`
              )} style={btnStyle(t, false)}>📤 Share</button>
            )}
          </div>
          {shareStatus && <div style={{ fontSize: 12, color: t.muted, marginTop: 8 }}>{shareStatus}</div>}
        </div>
      )}

      <div style={{ fontSize: 10, color: t.muted, marginTop: 24, textAlign: "center", maxWidth: 340, lineHeight: 1.6 }}>
        Single search-based opponent (depth {AI_DEPTH}, alpha-beta pruned) — no difficulty levels yet, that's the
        next tuning pass. Same rules and capture logic as Play mode.
      </div>
      </>
      )}

      {mode === "online" && onlineGateActive && (
        <FreemiumGate
          t={t} modeLabel="online" onUnlock={startCheckout} unlocking={checkoutBusy}
          restoreEmail={restoreEmail} setRestoreEmail={setRestoreEmail} restoreStatus={restoreStatus}
          onSubmitRestore={onSubmitRestore} restoreCode={restoreCode} setRestoreCode={setRestoreCode}
          onSubmitRestoreCode={onSubmitRestoreCode} showRestoreForm={showRestoreForm} setShowRestoreForm={setShowRestoreForm}
        />
      )}
      {mode === "online" && !onlineGateActive && (
        <OnlineGameView
          t={t}
          ruleVariant={ruleVariant}
          isPro={isPro}
          onlineCount={freemium.onlineCount}
          onGateNeeded={() => setOnlineGateActive(true)}
          onGameFinished={() => {
            setFreemium((prev) => {
              const next = { ...prev, onlineCount: prev.onlineCount + 1 };
              writeFreemiumState(next);
              return next;
            });
          }}
        />
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Hnefatafl />);
</script>
</body>
</html>
