<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

// ---------- Theme (same palette as the rest of the series) ----------

};
// Defenders/King use the accent teal family (no separate "CPU colour" needed
// here since both sides are human) — attackers stay in the gold/bronze
// family used for pieces everywhere else in the series.
const DEF_FROM = "#7fe8c9", DEF_TO = "#1c7a5e";
const KING_FROM = "#ffe9b0", KING_TO = "#c9962f";

function pillStyle(t, active) {
  return {
    display: "flex", alignItems: "center", gap: 5, padding: "6px 12px",
    borderRadius: 999, border: active ? `1px solid ${t.accent}` : `1px solid ${t.panelBorder}`,

}
function btnStyle(t, disabled, active) {

// ---------- Board frame — double border, Viking-era formal treatment ----------
// Outer band is a diagonal-striped "twisted rope" (a simple CSS stand-in for
// Norse interlace carving, no image asset or webfont needed), inner band is
// a thin bright-gold rule. Both reuse the existing KING_FROM/KING_TO gold
// already used for the king piece, so the frame reads as "the same gold",
// not a new colour introduced just for this.
function frameOuterStyle() {
  return {
    position: "relative",
    padding: 6,
    borderRadius: 12,
    background: `repeating-linear-gradient(135deg, ${KING_TO} 0px, ${KING_TO} 3px, #3a2c0c 3px, #3a2c0c 7px)`,
    boxShadow: "0 10px 28px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(0,0,0,0.5)",
  };
}
function frameInnerStyle(t) {
  return {
    position: "relative",
    padding: 3,
    borderRadius: 8,
    background: t.bg,
    boxShadow: `inset 0 0 0 2px ${KING_FROM}, inset 0 0 12px rgba(0,0,0,0.22)`,
  };
}
function cornerGlyphStyle(pos) {
  const base = { position: "absolute", fontSize: 13, color: KING_FROM, opacity: 0.9, textShadow: "0 0 6px rgba(0,0,0,0.6)", pointerEvents: "none", lineHeight: 1, zIndex: 2 };
  if (pos === "tl") return { ...base, top: 1, left: 3 };
  if (pos === "tr") return { ...base, top: 1, right: 3 };
  if (pos === "bl") return { ...base, bottom: 1, left: 3 };
  return { ...base, bottom: 1, right: 3 };
}
function BoardFrame({ t, children }) {
  return (
    <div style={frameOuterStyle()}>
      <span style={cornerGlyphStyle("tl")}>❖</span>
      <span style={cornerGlyphStyle("tr")}>❖</span>
      <span style={cornerGlyphStyle("bl")}>❖</span>
      <span style={cornerGlyphStyle("br")}>❖</span>
      <div style={frameInnerStyle(t)}>{children}</div>
    </div>
  );
}

// ---------- Runic border — "Fortune Favours The Brave" + SCVD.app ----------
// Younger Futhark (the 16-rune Viking-age script, as opposed to the older
// 24-rune Elder Futhark) transliterated via the standard Latin-to-Futhark
// correspondence table. Several English letters share one rune in this
// system (e.g. B/P both -> ᛒ, U/V/W/Y all -> ᚢ) — that's not a mapping
// error, it's genuinely how the Vikings wrote too, a real limitation of a
// 16-symbol alphabet. ᛫ is the runic single-punctuation dot, the actual
// historical word-divider used on real inscriptions.
// Requires the Noto Sans Runic webfont (linked in <head>) — most devices
// don't ship Runic glyph coverage, so without the font these render as
// tofu boxes rather than the intended runes.
function runicGridStyle() {
  return {
    display: "grid",
    gridTemplateColumns: "18px 1fr 18px",
    gridTemplateRows: "auto auto auto",
    alignItems: "center",
    justifyItems: "center",
  };
}
function runicTextStyle(vertical) {
  return {
    fontFamily: "'Noto Sans Runic', serif",
    fontSize: 13,
    letterSpacing: 2,
    color: KING_FROM,
    opacity: 0.85,
    textShadow: "0 0 6px rgba(0,0,0,0.5)",
    writingMode: vertical ? "vertical-rl" : "horizontal-tb",
    whiteSpace: "nowrap",
    userSelect: "none",
    padding: vertical ? "6px 0" : "0 6px",
  };
}
function RunicFrame({ children }) {
  return (
    <div style={runicGridStyle()}>
      <div />
      <div style={runicTextStyle(false)}>ᚠᚬᚢᚬᚢᚱᛋ</div>
      <div />
      <div style={runicTextStyle(true)}>ᚠᚬᚱᛏᚢᚾᛅ</div>
      {children}
      <div style={runicTextStyle(true)}>ᚦᛅ ᛫ ᛒᚱᚬᚢᛅ</div>
      <div />
      <div style={runicTextStyle(false)}>ᛋᚴᚢᛏ ᛫ ᚬᛒᛒ</div>
      <div />
    </div>
  );
}

// Outer rope ring — same twisted-rope treatment as the board's own inner
// border (frameOuterStyle), scaled up to encase the runic text as well,
// so the runes read as "inside the frame" rather than floating loose
// above/below/beside it.
function outerRopeStyle() {
  return {
    position: "relative",
    padding: 8,
    borderRadius: 16,
    background: `repeating-linear-gradient(135deg, ${KING_TO} 0px, ${KING_TO} 3px, #3a2c0c 3px, #3a2c0c 7px)`,
    boxShadow: "0 12px 32px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.5)",
    marginBottom: 18,
  };
}
function OuterRopeFrame({ t, children }) {
  return (
    <div style={outerRopeStyle()}>
      <span style={cornerGlyphStyle("tl")}>❖</span>
      <span style={cornerGlyphStyle("tr")}>❖</span>
      <span style={cornerGlyphStyle("bl")}>❖</span>
      <span style={cornerGlyphStyle("br")}>❖</span>
      <div style={{ position: "relative", borderRadius: 9, background: t.bg, padding: 3 }}>
        {children}
      </div>
    </div>
  );
}

// ---------- Board setup ----------
// Standard 11x11 Copenhagen Hnefatafl layout. Restricted squares (throne +
// 4 corners) are hostile for capture purposes always, and landable only by
// the king — this is one specific, commonly-used reconstruction, not the
// only historically argued version (board size alone ranges 7x7 to 13x13
// across regional variants — see in-app note).
const SIZE = 11;
const THRONE = { r: 5, c: 5 };
const CORNERS = [{ r: 0, c: 0 }, { r: 0, c: 10 }, { r: 10, c: 0 }, { r: 10, c: 10 }];
const RESTRICTED = new Set([THRONE, ...CORNERS].map((p) => key(p.r, p.c)));
function key(r, c) { return `${r},${c}`; }
function isRestricted(r, c) { return RESTRICTED.has(key(r, c)); }
function isCorner(r, c) { return CORNERS.some((p) => p.r === r && p.c === c); }
function isEdgeSquare(r, c) { return r === 0 || r === SIZE - 1 || c === 0 || c === SIZE - 1; }
// The single point that decides "has the king reached safety" everywhere in
// the app (real game, AI simulation, and the how-to-play diagrams' captions)
// — so an escape-type change in RULE_VARIANTS only ever needs editing here.
function isEscapeSquare(r, c, variant) {
  return variant.escape === "edge" ? isEdgeSquare(r, c) : isCorner(r, c);
}

// ---------- Rule variants ----------
// Four documented "schools" of Hnefatafl (per the taxonomy used by the
// Abstract Play community wiki, itself summarising aagenielsen.dk/Fetlar/
// Copenhagen sources and Mats Winther's "weak king" reading of the
// Stockholm Historical Museum's interpretation), plus "classic" — the
// ruleset this app actually shipped with originally (strong king, corner
// escape, unarmed king). Classic doesn't exactly match any one of the four
// named schools — it's closest to Imperial Contest but with corner escape
// instead of edge — so it stays a genuine 5th option rather than being
// folded into one of them, to avoid silently changing already-live
// behaviour for existing players/saves.
//
// kingStrength: "strong" = must be surrounded on all 4 orthogonal sides (or
//   3 + edge, once he's the last defender) to be captured. "weak" = captured
//   exactly like an ordinary piece — sandwiched on two opposite sides.
// kingArmed: whether the king's own move can close a capture against an
//   attacker. (He can always be used as the passive anvil in someone else's
//   capture, in every variant here — that's not in dispute in any source
//   checked.)
// escape: "corner" = must reach one of the 4 corners. "edge" = reaching any
//   edge square is enough.
// movement: "slide" = every piece moves like a rook. "kingSingleStep" =
//   the king moves exactly one square at a time; everyone else still
//   slides. (The source for Papillon's Escape says specifically "the king
//   is only allowed [to] make single steps" — read here as king-only, not
//   every piece; worth double-checking against a primary source if this
//   variant gets serious use, the wording was ambiguous.)
const RULE_VARIANTS = {
  classic: {
    key: "classic", name: "Classic", subtitle: "SCVD's original ruleset",
    kingStrength: "strong", kingArmed: false, escape: "corner", movement: "slide",
  },
  vikingGame: {
    key: "vikingGame", name: "Copenhagen", subtitle: "Strong armed king · corner escape",
    kingStrength: "strong", kingArmed: true, escape: "corner", movement: "slide",
  },
  historical: {
    key: "historical", name: "Historical", subtitle: "Weak armed king · edge escape",
    kingStrength: "weak", kingArmed: true, escape: "edge", movement: "slide",
  },
  imperialContest: {
    key: "imperialContest", name: "Imperial Contest", subtitle: "Strong unarmed king · edge escape",
    kingStrength: "strong", kingArmed: false, escape: "edge", movement: "slide",
  },
  papillon: {
    key: "papillon", name: "Papillon's Escape", subtitle: "King moves one square at a time",
    kingStrength: "strong", kingArmed: true, escape: "corner", movement: "kingSingleStep",
  },
};
const DEFAULT_VARIANT_KEY = "classic";
const RULE_VARIANT_KEY_STORAGE = "hnefatafl_rule_variant_v1";

function initialBoard() {
  const b = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  const attackers = [
    [0, 3], [0, 4], [0, 5], [0, 6], [0, 7], [1, 5],
    [10, 3], [10, 4], [10, 5], [10, 6], [10, 7], [9, 5],
    [3, 0], [4, 0], [5, 0], [6, 0], [7, 0], [5, 1],
    [3, 10], [4, 10], [5, 10], [6, 10], [7, 10], [5, 9],
  ];
  const defenders = [
    [3, 5], [4, 4], [4, 5], [4, 6],
    [5, 3], [5, 4], [5, 6], [5, 7],
    [6, 4], [6, 5], [6, 6], [7, 5],
  ];
  attackers.forEach(([r, c]) => { b[r][c] = "att"; });
  defenders.forEach(([r, c]) => { b[r][c] = "def"; });
  b[5][5] = "king";
  return b;
}

const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

function legalDestinations(board, r, c, variant = RULE_VARIANTS[DEFAULT_VARIANT_KEY]) {
  const piece = board[r][c];
  if (!piece) return [];
  const isKing = piece === "king";
  const singleStep = isKing && variant.movement === "kingSingleStep";
  const out = [];
  for (const [dr, dc] of DIRS) {
    let nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === null) {
      if (isRestricted(nr, nc) && !isKing) {
        if (singleStep) break; // not reachable this move — dead end for a one-step piece
        nr += dr; nc += dc; continue;
      }
      // (throne/corner squares are simply skipped as landable, but a piece
      // still can't slide PAST an occupied square, and the throne being
      // empty doesn't block sliding through it — corners are dead-ends so
      // this loop just never reaches past them anyway)
      out.push([nr, nc]);
      if (singleStep) break;
      nr += dr; nc += dc;
    }
  }
  return out;
}

function resolveCaptures(board, r, c, side) {
  // side = the side that just moved to (r,c); captures ordinary enemy
  // pieces (not the king — king capture is checked separately) sandwiched
  // between the moved piece and either another friendly piece or a hostile
  // restricted square.
  const enemy = side === "att" ? "def" : "att";
  const captured = [];
  for (const [dr, dc] of DIRS) {
    const mr = r + dr, mc = c + dc;
    const fr = r + dr * 2, fc = c + dc * 2;
    if (mr < 0 || mr >= SIZE || mc < 0 || mc >= SIZE) continue;
    if (board[mr][mc] !== enemy) continue; // only ordinary enemy pieces here
    const farInBounds = fr >= 0 && fr < SIZE && fc >= 0 && fc < SIZE;
    // Normalise "king" to "def" for this comparison — the king fights
    // alongside his own defenders, including as the anvil in a sandwich.
    // Comparing the raw board value directly against `side` missed this:
    // a regular defender closing a capture against the king (stored as
    // "king", not "def") would never match, even though it should.
    const farPieceSide = farInBounds ? (board[fr][fc] === "king" ? "def" : board[fr][fc]) : null;
    const farIsFriendly = farPieceSide === side;
    const farIsHostileSquare = farInBounds && isRestricted(fr, fc);
    if (farIsFriendly || farIsHostileSquare) captured.push([mr, mc]);
  }
  return captured;
}

// Weak-king capture: same mechanism as an ordinary piece — sandwiched
// between two hostile squares (attacker or restricted square) on ONE
// straight axis, not all four sides. The board edge never stands in for a
// piece here (an edge-escape variant would make that a strange rule — the
// edge is where he's trying to go, not a wall closing in on him).
function isHostileToKing(board, r, c) {
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
  return board[r][c] === "att" || isRestricted(r, c);
}
function checkKingCapturedWeak(board, kingR, kingC) {
  const axes = [[[-1, 0], [1, 0]], [[0, -1], [0, 1]]];
  return axes.some(([[dr1, dc1], [dr2, dc2]]) =>
    isHostileToKing(board, kingR + dr1, kingC + dc1) && isHostileToKing(board, kingR + dr2, kingC + dc2)
  );
}
function checkKingCaptured(board, kingR, kingC, isLastDefender, variant = RULE_VARIANTS[DEFAULT_VARIANT_KEY]) {
  if (variant.kingStrength === "weak") return checkKingCapturedWeak(board, kingR, kingC);
  for (const [dr, dc] of DIRS) {
    const nr = kingR + dr, nc = kingC + dc;
    if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) {
      // Off the board on this side. Normally that means the king can't be
      // fully surrounded here — the edge itself is his sanctuary. But per
      // the Fetlar rules' last-stand exception, once he's the only
      // defending piece left, the board edge no longer shields him: it
      // simply counts as satisfied, same as a hostile square would.
      if (isLastDefender) continue;
      return false;
    }
    const occ = board[nr][nc];
    const hostile = occ === "att" || isRestricted(nr, nc);
    if (!hostile) return false;
  }
  return true;
}

// ---------- King freedom scoring ----------
// Ported directly from the AI evaluation-function design — same functions,
// tested there against real positions. Used here to detect the moment the
// king tips from "contained" to "loose," for the berserker visual — the
// exact threshold the eventual AI's opening strategy will be built to
// prevent from ever being reached.
function openCorridors(board, kingR, kingC) {
  let count = 0;
  for (const [dr, dc] of DIRS) {
    let r = kingR + dr, c = kingC + dc, clear = true;
    while (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
      if (board[r][c] !== null) { clear = false; break; }
      r += dr; c += dc;
    }
    if (clear) count++;
  }
  return count;
}
function maxCorridorLength(board, kingR, kingC) {
  let best = 0;
  for (const [dr, dc] of DIRS) {
    let r = kingR + dr, c = kingC + dc, len = 0;
    while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === null) {
      len++; r += dr; c += dc;
    }
    best = Math.max(best, len);
  }
  return best;
}
function openCornerPaths(board, kingR, kingC) {
  const corners = [[0, 0], [0, 10], [10, 0], [10, 10]];
  let open = 0;
  for (const [cr, cc] of corners) {
    const sameRow = kingR === cr, sameCol = kingC === cc;
    if (!sameRow && !sameCol) continue;
    const dr = Math.sign(cr - kingR), dc = Math.sign(cc - kingC);
    let r = kingR + dr, c = kingC + dc, clear = true;
    while (r !== cr || c !== cc) {
      if (board[r][c] !== null) { clear = false; break; }
      r += dr; c += dc;
    }
    if (clear) open++;
  }
  return open;
}
// A real threshold, not an arbitrary one: the king is "loose" once he has
// an actual near-lethal opening (a genuinely open run at a corner) OR is
// simply free to move a long way in most directions at once.
function isKingLoose(board, kingR, kingC) {
  if (!kingR && kingR !== 0) return false;
  if (openCornerPaths(board, kingR, kingC) >= 1) return true;
  if (openCorridors(board, kingR, kingC) >= 3 && maxCorridorLength(board, kingR, kingC) >= 4) return true;
  return false;
}

// ---------- AI opponent ----------
// Move generation, position simulation, evaluation and search — the pieces
// scoped-but-not-built in hnefatafl-ai-eval-design.md, now wired up.
//
// The defender-side freedom scoring below (kingFreedomScore) is a
// reconstruction built from the exact same tested functions above
// (openCorridors/maxCorridorLength/openCornerPaths — not reimplemented,
// literally the same functions), weighted to land on the two anchor points
// described in the design doc: a boxed-in start position scores 0, and a
// fully-open corner-run position scores roughly 160. If you've still got
// the original doc's exact formula, paste it and I'll swap this for the
// byte-identical version — this is a faithful reconstruction, not
// guaranteed identical to what you tested that session.
//
// Attacker-side scoring (corridorsClosed/cornerLanesHeld/sentrySafety) was
// only sketched conceptually in the design doc, never coded — rather than
// invent those from scratch, the attacker's incentive here is simply to
// minimise the defender's freedom score (the mirror image of the
// defender's goal). A dedicated attacker eval is a good next tuning pass,
// not a gap in this build.

function piecesOfSide(board, side) {
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const p = board[r][c];
    if (p === side || (side === "def" && p === "king")) out.push({ r, c });
  }
  return out;
}

function allLegalMoves(board, side, variant = RULE_VARIANTS[DEFAULT_VARIANT_KEY]) {
  const moves = [];
  for (const { r, c } of piecesOfSide(board, side)) {
    for (const [nr, nc] of legalDestinations(board, r, c, variant)) {
      moves.push({ from: { r, c }, to: { r: nr, c: nc } });
    }
  }
  return moves;
}

// Shared king-armed gate — the ONE place that decides whether the piece
// that just moved is allowed to close a capture. Both the human move path
// (Play mode's movePiece) and this AI path (simulateMove, used by Challenge
// mode's human moves too, and by minimax) call through here now. Previously
// Play mode hard-coded "king never captures" inline while this function
// didn't check at all — meaning Challenge mode's human moves (and the AI)
// were quietly playing an armed-king game while Play mode played unarmed.
// Fixed as part of wiring variants through, since it's the same knob.
function resolveMoveCaptures(board, r, c, side, movedPiece, variant) {
  if (movedPiece === "king" && !variant.kingArmed) return [];
  return resolveCaptures(board, r, c, side);
}

// Pure move application for search/AI use — deliberately reuses the same
// resolveCaptures/checkKingCaptured functions the real game uses, rather
// than re-deriving capture logic, so the AI can never "see" a different
// game than the one a human actually plays.
function simulateMove(board, from, to, side, variant = RULE_VARIANTS[DEFAULT_VARIANT_KEY]) {
  const next = board.map((row) => row.slice());
  const piece = next[from.r][from.c];
  next[from.r][from.c] = null;
  next[to.r][to.c] = piece;

  const captured = resolveMoveCaptures(next, to.r, to.c, side, piece, variant);
  captured.forEach(([r, c]) => { next[r][c] = null; });

  let kingCaptured = false;
  const kingEscaped = piece === "king" && isEscapeSquare(to.r, to.c, variant);
  if (!kingEscaped) {
    let kingPos = null;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (next[r][c] === "king") kingPos = { r, c };
    if (kingPos) {
      const remainingDef = next.flat().filter((p) => p === "def").length;
      kingCaptured = checkKingCaptured(next, kingPos.r, kingPos.c, remainingDef === 0, variant);
    }
  }
  return { board: next, captured, kingCaptured, kingEscaped };
}

function findKing(board) {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === "king") return { r, c };
  return null;
}

// null = game continues, "att"/"def" = that side has already won on this board.
function terminalWinner(board, variant) {
  const kingPos = findKing(board);
  if (!kingPos) return "att"; // king captured
  if (isEscapeSquare(kingPos.r, kingPos.c, variant)) return "def"; // king reached safety
  return null;
}

function kingFreedomScore(board, kingR, kingC) {
  const corners = openCornerPaths(board, kingR, kingC);   // 0-4, worth 50 each — matches the doc's "50pts" anchor
  const corridors = openCorridors(board, kingR, kingC);   // 0-4
  const maxLen = maxCorridorLength(board, kingR, kingC);  // 0-10ish
  return corners * 50 + corridors * maxLen * 3;
}

// Score from the DEFENDER's perspective — positive is good for defenders.
// NOTE on variant tuning: this eval — like kingFreedomScore above it — was
// built and weighted against the "classic" corner-escape assumption
// (openCornerPaths specifically rewards runs at the 4 literal corners). It
// still functions for the other variants (moves are always legal, games
// still terminate correctly), but for edge-escape variants (historical,
// imperial contest) it will systematically undervalue a king who's run
// safely to a non-corner edge square, and for weak-king variants it has no
// special awareness that only ONE opposing pair of sides matters rather
// than all four. The AI will play those variants noticeably weaker until
// this gets a dedicated tuning pass — same flagged-not-glossed-over
// situation as the attacker eval already noted below.
function evaluateForDefender(board, variant) {
  const kingPos = findKing(board);
  if (!kingPos) return -100000; // king already gone
  if (isEscapeSquare(kingPos.r, kingPos.c, variant)) return 100000; // king already escaped

  let att = 0, def = 0;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const p = board[r][c];
    if (p === "att") att++; else if (p === "def") def++;
  }
  // Material weighted 2:1 in defenders' favour, matching the doc's
  // "2pts per surviving defender" anchor against attacker material.
  const material = def * 2 - att;
  const freedom = kingFreedomScore(board, kingPos.r, kingPos.c);
  return material + freedom;
}

function evaluateBoard(board, aiSide, variant) {
  const score = evaluateForDefender(board, variant);
  return aiSide === "def" ? score : -score;
}

// Depth-limited minimax with alpha-beta pruning. AI_DEPTH below is the one
// difficulty knob for now (per the plan: one solid strength first, tune
// later) — 3 plies is a deliberately conservative starting point given the
// branching factor concern flagged in the design doc (up to 37 pieces,
// each sliding multiple squares, in a game with no piece-jumping to limit
// destinations). Drop to 2 first if a real device feels sluggish; that's
// the whole tuning lever.
function minimax(board, depth, alpha, beta, sideToMove, aiSide, variant) {
  const term = terminalWinner(board, variant);
  if (term) return term === aiSide ? 100000 + depth : -100000 - depth;
  if (depth === 0) return evaluateBoard(board, aiSide, variant);

  const moves = allLegalMoves(board, sideToMove, variant);
  if (moves.length === 0) {
    // No legal moves for the side to move — treated as a loss for them,
    // same convention the real game already uses for a dead position.
    return sideToMove === aiSide ? -100000 - depth : 100000 + depth;
  }

  const maximizing = sideToMove === aiSide;
  let best = maximizing ? -Infinity : Infinity;
  const nextSide = sideToMove === "att" ? "def" : "att";
  for (const move of moves) {
    const { board: next } = simulateMove(board, move.from, move.to, sideToMove, variant);
    const val = minimax(next, depth - 1, alpha, beta, nextSide, aiSide, variant);
    if (maximizing) {
      if (val > best) best = val;
      if (val > alpha) alpha = val;
    } else {
      if (val < best) best = val;
      if (val < beta) beta = val;
    }
    if (beta <= alpha) break; // prune
  }
  return best;
}

const AI_DEPTH = 3;

function chooseAiMove(board, aiSide, variant = RULE_VARIANTS[DEFAULT_VARIANT_KEY]) {
  const moves = allLegalMoves(board, aiSide, variant);
  if (moves.length === 0) return null;
  const nextSide = aiSide === "att" ? "def" : "att";
  let bestMove = moves[0], bestVal = -Infinity;
  for (const move of moves) {
    const { board: next } = simulateMove(board, move.from, move.to, aiSide, variant);
    const val = minimax(next, AI_DEPTH - 1, -Infinity, Infinity, nextSide, aiSide, variant);
    if (val > bestVal) { bestVal = val; bestMove = move; }
  }
  return bestMove;
}

// ---------- Autosave ----------
// This is a standalone file, not a claude.ai artifact, so ordinary
// localStorage is the right tool here (the no-browser-storage rule is an
// artifact-sandbox constraint, not a general one) — lets the game survive
// a preview reload or an accidental tab close without losing progress.
const SAVE_KEY = "hnefatafl_save_v1";
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}
function writeSave(state) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable — fail silently */ }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

// Challenge mode save — separate slot from Play's: switching modes should
// never disturb a different mode's in-progress game.
const CHALLENGE_SAVE_KEY = "hnefatafl_challenge_v1";
function loadChallengeSave() {
  try {
    const raw = localStorage.getItem(CHALLENGE_SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeChallengeSave(state) {
  try { localStorage.setItem(CHALLENGE_SAVE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
function clearChallengeSave() {
  try { localStorage.removeItem(CHALLENGE_SAVE_KEY); } catch (e) { /* ignore */ }
}

// ---------- Online play (Phase 1: play-once invite link) ----------
// Talks to a SEPARATE Cloudflare Worker (ancient-games-online-worker.js) —
// deliberately not the Stripe worker, no shared code or KV. See that
// file's header comment for the full security model. Free, unmetered, no
// account required for phase 1 — the invite token itself is the only
// gate, matching the "fog of war" design agreed on: nothing here is
// discoverable, only reachable by whoever was actually sent the link.
//
// TODO before shipping: replace with the real deployed Worker URL once
// it's live (Workers → Deploy, then the *.workers.dev URL or a custom
// route). Everything below is written against the API contract that
// Worker implements, but it obviously can't reach a placeholder host.
const ONLINE_API_BASE = "https://ancient-games-online.emblen-scott.workers.dev";
const ONLINE_GAME_STORAGE_KEY = "hnefatafl_online_game_v1";

function loadOnlineGameRecord() {
  try {
    const raw = localStorage.getItem(ONLINE_GAME_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveOnlineGameRecord(rec) {
  try { localStorage.setItem(ONLINE_GAME_STORAGE_KEY, JSON.stringify(rec)); } catch (e) { /* ignore */ }
}
function clearOnlineGameRecord() {
  try { localStorage.removeItem(ONLINE_GAME_STORAGE_KEY); } catch (e) { /* ignore */ }
}
function getInviteTokenFromUrl() {
  try { return new URLSearchParams(window.location.search).get("invite"); } catch (e) { return null; }
}
function stripInviteFromUrl() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete("invite");
    window.history.replaceState({}, "", url.toString());
  } catch (e) { /* ignore */ }
}
async function onlineApiGet(path) {
  const res = await fetch(`${ONLINE_API_BASE}${path}`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
async function onlineApiPost(path, body, secret) {
  const headers = { "Content-Type": "application/json" };
  if (secret) headers["X-Player-Secret"] = secret;
  const res = await fetch(`${ONLINE_API_BASE}${path}`, { method: "POST", headers, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

// Deliberately plainer visual treatment than Play/Challenge for phase 1 —
// no double-rope frame, no runic border, no share-card canvas render. Same
// piece colours and restricted-square glyphs so it doesn't look like a
// different app, just a simpler board chrome. Worth revisiting once the
// feature's proven itself with real friend-pairs rather than polishing it
// up front.
function OnlineGameView({ t, ruleVariant, isPro, onlineCount, onGateNeeded, onGameFinished }) {
  const [phase, setPhase] = useState("loading"); // loading | menu | invitePending | joinPreview | active
  const [myRecord, setMyRecord] = useState(() => loadOnlineGameRecord());
  const [game, setGame] = useState(null);
  const [inviteUrl, setInviteUrl] = useState("");
  const [joinPreview, setJoinPreview] = useState(null);
  const [joinToken, setJoinToken] = useState(null);
  const [selected, setSelected] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [copyLabel, setCopyLabel] = useState("Copy Link");

  // Counts a completed game exactly once, and only a genuine transition
  // into "finished" — never a resumed game that was already finished when
  // first loaded (that's a reconnect, not a new result; same "reset never
  // penalises" spirit as the Play/Challenge counters). prevFinishedRef
  // starts at null specifically so the very first state this component
  // ever sees (fresh load OR resume) just sets the baseline without
  // counting, regardless of which phase of the game it walks in on.
  const prevFinishedRef = useRef(null);
  function setGameState(newState) {
    setGame(newState);
    if (!newState) return;
    const isFinished = newState.status === "finished";
    if (prevFinishedRef.current === null) {
      prevFinishedRef.current = isFinished;
      return;
    }
    if (isFinished && !prevFinishedRef.current) {
      prevFinishedRef.current = true;
      if (typeof onGameFinished === "function") onGameFinished();
    } else {
      prevFinishedRef.current = isFinished;
    }
  }

  // ---- Initial routing: resume a saved game, or preview an invite link ----
  useEffect(() => {
    (async () => {
      if (myRecord && myRecord.gameId) {
        try {
          const state = await onlineApiGet(`/games/${myRecord.gameId}/state`);
          setGameState(state);
          setPhase(state.status === "waiting" ? "invitePending" : "active");
          return;
        } catch (e) {
          // Saved game is gone/stale (expired, server reset, etc.) — don't
          // get stuck, just clear it and fall through to the normal flow.
          clearOnlineGameRecord();
          setMyRecord(null);
        }
      }
      const token = getInviteTokenFromUrl();
      if (token) {
        try {
          const preview = await onlineApiGet(`/invite/${token}`);
          setJoinToken(token);
          setJoinPreview(preview);
          setPhase("joinPreview");
          return;
        } catch (e) {
          setErrorMsg("That invite link isn't valid anymore — ask your friend to send a new one.");
          stripInviteFromUrl();
        }
      }
      setPhase("menu");
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // ---- Polling while waiting for a guest, or while a game is active ----
  useEffect(() => {
    if (phase !== "invitePending" && phase !== "active") return;
    if (!myRecord?.gameId) return;
    const timer = setInterval(async () => {
      try {
        const state = await onlineApiGet(`/games/${myRecord.gameId}/state`);
        setGameState(state);
        if (phase === "invitePending" && state.status === "active") setPhase("active");
      } catch (e) { /* transient network hiccup — just try again next tick */ }
    }, 5000); // 5s not 3s — halves read volume against Cloudflare's KV free-tier daily cap for barely any perceptible lag on a turn-based game
    return () => clearInterval(timer);
  }, [phase, myRecord]);

  async function createInvite() {
    if (!isPro && onlineCount >= FREE_GAMES_PER_MODE_PER_DAY) {
      onGateNeeded && onGateNeeded();
      return;
    }
    setBusy(true);
    setErrorMsg("");
    try {
      const res = await onlineApiPost("/invite/create", { variant: ruleVariant.key });
      const rec = { gameId: res.gameId, secret: res.hostSecret, side: "att", variant: res.variant };
      saveOnlineGameRecord(rec);
      setMyRecord(rec);
      setInviteUrl(res.url);
      prevFinishedRef.current = null; // fresh game — re-baseline the finish counter
      setPhase("invitePending");
    } catch (e) {
      setErrorMsg(e.message || "Couldn't create an invite right now.");
    } finally {
      setBusy(false);
    }
  }

  async function joinGame() {
    if (!joinToken) return;
    if (!isPro && onlineCount >= FREE_GAMES_PER_MODE_PER_DAY) {
      onGateNeeded && onGateNeeded();
      return;
    }
    setBusy(true);
    setErrorMsg("");
    try {
      const res = await onlineApiPost(`/invite/${joinToken}/redeem`, {});
      const rec = { gameId: res.gameId, secret: res.guestSecret, side: res.guestSide, variant: res.variant };
      saveOnlineGameRecord(rec);
      setMyRecord(rec);
      stripInviteFromUrl();
      prevFinishedRef.current = null; // fresh game — re-baseline the finish counter
      const state = await onlineApiGet(`/games/${res.gameId}/state`);
      setGameState(state);
      setPhase("active");
    } catch (e) {
      setErrorMsg(e.message || "Couldn't join that game — the link may have just been used.");
    } finally {
      setBusy(false);
    }
  }

  function leaveGame() {
    clearOnlineGameRecord();
    setMyRecord(null);
    setGame(null);
    setSelected(null);
    prevFinishedRef.current = null;
    setPhase("menu");
  }

  async function shareInvite() {
    try {
      if (navigator.share) await navigator.share({ title: "Hnefatafl", text: "Join me for a game of Hnefatafl:", url: inviteUrl });
      else await copyInvite();
    } catch (e) { /* user cancelled the share sheet — not an error */ }
  }
  async function copyInvite() {
    try {
      await navigator.clipboard.writeText(inviteUrl);
      setCopyLabel("Copied!");
      setTimeout(() => setCopyLabel("Copy Link"), 1800);
    } catch (e) { /* clipboard permission denied — link is still shown on screen to copy manually */ }
  }

  const variant = RULE_VARIANTS[game?.variant] || ruleVariant;
  const legalDestSet = useMemo(() => {
    if (!selected || !game || game.turn !== myRecord?.side) return new Set();
    return new Set(legalDestinations(game.board, selected.r, selected.c, variant).map(([r, c]) => key(r, c)));
  }, [selected, game, myRecord, variant]);

  async function handleCellClick(r, c) {
    if (!game || game.status !== "active" || game.turn !== myRecord?.side) return;
    const piece = game.board[r][c];
    const mySideOwnsPiece = piece === myRecord.side || (piece === "king" && myRecord.side === "def");

    if (selected) {
      if (legalDestSet.has(key(r, c))) {
        setBusy(true);
        setErrorMsg("");
        try {
          const updated = await onlineApiPost(`/games/${myRecord.gameId}/move`, { from: selected, to: { r, c } }, myRecord.secret);
          setGameState(updated);
        } catch (e) {
          setErrorMsg(e.message || "That move didn't go through — the board may have just changed.");
        } finally {
          setSelected(null);
          setBusy(false);
        }
        return;
      }
      if (mySideOwnsPiece) { setSelected({ r, c }); return; }
      setSelected(null);
      return;
    }
    if (mySideOwnsPiece) setSelected({ r, c });
  }

  const wrap = { display: "flex", flexDirection: "column", alignItems: "center", width: "100%", maxWidth: 460 };

  if (phase === "loading") {
    return <div style={{ ...wrap, color: t.muted, fontSize: 13, padding: 30 }}>Loading…</div>;
  }

  if (phase === "menu") {
    const remaining = Math.max(0, FREE_GAMES_PER_MODE_PER_DAY - onlineCount);
    return (
      <div style={wrap}>
        <div style={{ fontSize: 14, color: t.text, textAlign: "center", lineHeight: 1.6, marginBottom: 10 }}>
          Send a friend a private link and play a game together — no account needed. Only someone with the exact link can join; there's no public lobby or search.
        </div>
        <div style={{ fontSize: 12, color: t.muted, textAlign: "center", marginBottom: 16 }}>
          {isPro ? "Unlimited online games — thanks for going Pro." : `${remaining} of ${FREE_GAMES_PER_MODE_PER_DAY} free online games left today.`}
        </div>
        <button onClick={createInvite} disabled={busy} style={{ ...btnStyle(t, busy, true), padding: "12px 22px", fontSize: 14 }}>
          {busy ? "Creating…" : "🤝 Invite a Friend"}
        </button>
        {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 12, textAlign: "center" }}>{errorMsg}</div>}
      </div>
    );
  }

  if (phase === "joinPreview") {
    return (
      <div style={wrap}>
        <div style={{ fontSize: 15, color: t.text, textAlign: "center", lineHeight: 1.6, marginBottom: 16 }}>
          You've been invited to a game of Hnefatafl{joinPreview?.variant ? ` (${RULE_VARIANTS[joinPreview.variant]?.name || joinPreview.variant} rules)` : ""}.
        </div>
        <button onClick={joinGame} disabled={busy} style={{ ...btnStyle(t, busy, true), padding: "12px 22px", fontSize: 14 }}>
          {busy ? "Joining…" : "⚔️ Join Game"}
        </button>
        {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 12, textAlign: "center" }}>{errorMsg}</div>}
      </div>
    );
  }

  if (phase === "invitePending") {
    return (
      <div style={wrap}>
        <div style={{ fontSize: 14, color: t.text, textAlign: "center", marginBottom: 14 }}>
          Waiting for your friend to open the link and join…
        </div>
        <div style={{
          width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${t.panelBorder}`,
          background: t.panel, color: t.muted, fontSize: 12, wordBreak: "break-all", marginBottom: 10, textAlign: "center",
        }}>
          {inviteUrl}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={shareInvite} style={{ ...btnStyle(t, false), fontSize: 13 }}>📤 Share</button>
          <button onClick={copyInvite} style={{ ...btnStyle(t, false), fontSize: 13 }}>{copyLabel}</button>
          <button onClick={leaveGame} style={{ ...btnStyle(t, false), fontSize: 13 }}>Cancel</button>
        </div>
      </div>
    );
  }

  // phase === "active" (also covers a just-finished game, still shown on the board)
  if (!game) return <div style={{ ...wrap, color: t.muted, fontSize: 13, padding: 30 }}>Loading…</div>;

  const mySide = myRecord?.side;
  const myTurn = game.status === "active" && game.turn === mySide;
  const CELL = 30;
  const BOARD_PX = CELL * SIZE;

  return (
    <div style={wrap}>
      <div style={{ fontSize: 13, color: t.text, textAlign: "center", marginBottom: 10 }}>
        You are playing <strong>{mySide === "att" ? "Muscovites" : "Swedes"}</strong>.{" "}
        {game.status === "finished"
          ? (game.winner === mySide ? "You won!" : "Your friend won.")
          : myTurn ? "Your move." : "Waiting for your friend's move…"}
      </div>

      <div style={{
        position: "relative", width: BOARD_PX, height: BOARD_PX, background: t.holeEmpty,
        border: `2px solid ${t.panelBorder}`, borderRadius: 6, display: "grid",
        gridTemplateColumns: `repeat(${SIZE}, ${CELL}px)`, gridTemplateRows: `repeat(${SIZE}, ${CELL}px)`,
      }}>
        {game.board.map((row, r) => row.map((piece, c) => {
          const restricted = isRestricted(r, c);
          const isDest = legalDestSet.has(key(r, c));
          const isSelected = selected && selected.r === r && selected.c === c;
          const lastMove = game.moveHistory?.[game.moveHistory.length - 1];
          const isLastMove = lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c));
          const pieceIsKing = piece === "king";
          const pieceSide = piece === "king" ? "def" : piece;
          const size = 24;
          return (
            <div
              key={`${r}-${c}`}
              onClick={() => handleCellClick(r, c)}
              style={{
                width: CELL, height: CELL, display: "flex", alignItems: "center", justifyContent: "center",
                background: restricted ? t.restricted : "transparent",
                boxShadow: isDest ? `inset 0 0 0 2px ${t.accent}` : isLastMove ? "inset 0 0 0 2px #e8c468" : "none",
                cursor: myTurn ? "pointer" : "default",
              }}
            >
              {restricted && !piece && <span style={{ fontSize: size * 0.5, opacity: 0.55 }}>{isCorner(r, c) ? "◆" : "♛"}</span>}
              {piece && (
                <div style={{
                  width: pieceIsKing ? size * 1.15 : size, height: pieceIsKing ? size * 1.15 : size, borderRadius: "50%",
                  background: pieceIsKing
                    ? `radial-gradient(circle at 35% 30%, ${KING_FROM}, ${KING_TO})`
                    : pieceSide === "att"
                    ? `radial-gradient(circle at 35% 30%, ${t.pegFrom}, ${t.pegTo})`
                    : `radial-gradient(circle at 35% 30%, ${DEF_FROM}, ${DEF_TO})`,
                  boxShadow: isSelected ? `0 0 0 2px ${t.accent}` : "0 1px 2px rgba(0,0,0,0.5)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  {pieceIsKing && <span style={{ fontSize: size * 0.55 }}>♛</span>}
                </div>
              )}
            </div>
          );
        }))}
      </div>

      {errorMsg && <div style={{ color: "#ff6b5b", fontSize: 12, marginTop: 10, textAlign: "center" }}>{errorMsg}</div>}
      <button onClick={leaveGame} style={{ ...btnStyle(t, false), fontSize: 12, marginTop: 14 }}>
        {game.status === "finished" ? "Leave Game" : "Forfeit & Leave"}
      </button>
    </div>
  );
}

// ---------- Freemium daily quota ----------
// 3 completed games per day, Play and Challenge tracked separately (6
// total). Resets don't count — only a real win/loss increments the
// counter, via a "did winner just become truthy this session" check in
// the component, not just "is winner truthy" (which would also fire on
// resuming an already-finished saved game). Boundary is device-local
// midnight, not a rolling 24h window, matching how most daily-limit games
// behave. isPro below is a DEV-ONLY bypass — same pattern as Jumpin' Pin's
// early sessions (dev-only checkbox before real Stripe checkout existed).
// Remove/replace with a real purchase check before any public release.
const FREEMIUM_KEY = "hnefatafl_freemium_v1";
const FREE_GAMES_PER_MODE_PER_DAY = 3;
function todayLocalKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function loadFreemiumState() {
  const today = todayLocalKey();
  try {
    const raw = localStorage.getItem(FREEMIUM_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (!parsed || parsed.date !== today) return { date: today, playCount: 0, challengeCount: 0, onlineCount: 0 };

    // from before this update won't have it, so default it in rather than
    // leave it undefined (which would make every >= comparison false and
    // silently grant unlimited online games to existing installs).
    return { onlineCount: 0, ...parsed };
  } catch (e) {
    return { date: today, playCount: 0, challengeCount: 0, onlineCount: 0 };
  }

// SHARE / BRAG CARD — self-propagation feature, the substitute for app
// store discoverability. Generates a shareable PNG (canvas, no image
// asset dependency) styled to match the board's own visual language —
// double rope border, gold Georgia type, the runic brand mark — then
// hands it to the Web Share API with graceful fallbacks:
//   1. navigator.share with a file attached (most mobile browsers) — the
//      actual image goes straight into whatever app the person picks.
//   2. navigator.share text+link only (older mobile browsers).
//   3. Download the image + copy the link (desktop / no Web Share API).
// Update SHARE_URL if this moves off GitHub Pages to a custom domain.
// ══════════════════════════════════════════════════════════
const SHARE_URL = "https://scvd-app.github.io/Hnefatafl/";
// Appended to shared links so a recipient lands on the invite screen
// instead of straight into the game — see InviteLanding below.
const SHARE_URL_WITH_INVITE = `${SHARE_URL}?invite=1`;

async function generateShareCardBlob({ side, statLine }) {
  const W = 1080, H = 1350;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const bg = ctx.createRadialGradient(W / 2, H * 0.32, 100, W / 2, H * 0.32, H * 0.95);
  bg.addColorStop(0, "#0d1a1a");
  bg.addColorStop(0.55, "#060b0d");
  bg.addColorStop(1, "#030405");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  function auroraBlob(cx, cy, rx, ry, color) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.35;
  auroraBlob(W * 0.2, H * 0.08, W * 0.4, H * 0.15, "rgba(53,208,160,0.35)");
  auroraBlob(W * 0.8, H * 0.05, W * 0.35, H * 0.12, "rgba(201,150,47,0.3)");
  ctx.globalAlpha = 1;

  // Double rope-echo border (flat gold, not the diagonal stripe texture —
  // that's a CSS trick, not worth reproducing pixel-by-pixel on canvas)
  const margin = 36;
  ctx.strokeStyle = "#8a6d1a";
  ctx.lineWidth = 14;
  ctx.strokeRect(margin, margin, W - margin * 2, H - margin * 2);
  ctx.strokeStyle = "#e8c468";
  ctx.lineWidth = 3;
  ctx.strokeRect(margin + 18, margin + 18, W - (margin + 18) * 2, H - (margin + 18) * 2);

  ctx.fillStyle = "#e8c468";
  ctx.font = "40px Georgia";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const cp = 62;
  ctx.fillText("❖", cp, cp);
  ctx.fillText("❖", W - cp, cp);
  ctx.fillText("❖", cp, H - cp);
  ctx.fillText("❖", W - cp, H - cp);

  ctx.fillStyle = "#8b9a97";
  ctx.font = "700 26px Georgia";
  ctx.fillText("A N C I E N T   G A M E S   ·   0 4", W / 2, 190);

  ctx.fillStyle = "#e8c468";
  ctx.font = "900 88px Georgia";
  ctx.shadowColor = "rgba(232,196,104,0.6)";
  ctx.shadowBlur = 28;
  ctx.fillText("HNEFATAFL", W / 2, 290);
  ctx.shadowBlur = 0;

  ctx.font = "900 128px Georgia";
  ctx.shadowColor = "rgba(232,196,104,0.7)";
  ctx.shadowBlur = 38;
  ctx.fillText("VICTORY", W / 2, 520);
  ctx.shadowBlur = 0;

  const sideLabel = side === "att" ? "MUSCOVITES" : "SWEDES";
  const icon = side === "att" ? "⚔️" : "🛡️";
  ctx.font = "60px Arial";
  ctx.fillText(icon, W / 2 - 170, 655);
  ctx.fillStyle = "#f5f3ee";
  ctx.font = "700 56px Georgia";
  ctx.fillText(sideLabel, W / 2 + 60, 655);

  if (statLine) {
    ctx.fillStyle = "#8b9a97";
    ctx.font = "700 32px 'Courier New', monospace";
    ctx.fillText(statLine.toUpperCase(), W / 2, 730);
  }

  try { await document.fonts.load('700 60px "Noto Sans Runic"'); } catch (e) { /* font API not supported — draw with fallback */ }
  ctx.fillStyle = "#e8c468";
  ctx.font = "60px 'Noto Sans Runic', serif";
  ctx.shadowColor = "rgba(232,196,104,0.5)";
  ctx.shadowBlur = 18;
  ctx.fillText("ᛋᚴᚢᛏ ᛫ ᚬᛒᛒ", W / 2, 1140);
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#8b9a97";
  ctx.font = "italic 32px Georgia";
  ctx.fillText("(scvd.app)", W / 2, 1195);

  // The literal clickable URL — printed directly on the image because
  // several chat apps (Messenger among them) drop share caption text
  // entirely once a file is attached, no matter what's passed to
  // navigator.share. A caption that might vanish isn't a link; text
  // baked into the picture always survives.
  ctx.fillStyle = "#e8c468";
  ctx.font = "700 30px 'Courier New', monospace";
  ctx.fillText("scvd-app.github.io/Hnefatafl", W / 2, 1240);

  ctx.fillStyle = "#8b9a97";
  ctx.font = "24px Georgia";
  ctx.fillText("Free to play · No ads · No subscriptions", W / 2, 1275);

  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

// ---------- Standard "receipts" share message ----------
// Same shape across every SCVD app (originated in ECEG): hook line, blank,
// stat + badge lines, blank, CTA + link with the 🎮 emoji. Keep this exact
// structure when porting to Ur/Nine Men's Morris — build a statLine and
// badgeLine from whatever that game actually tracks, but don't change the
// template shape itself.
function buildShareText({ gameName, statLine, badgeLine, ctaLine, url }) {
  return [
    `I just played ${gameName} and I've got receipts.`,
    "",
    statLine,
    badgeLine,
    "",
    ctaLine,
    `🎮 ${url}`,
  ].join("\n");
}

function sideTitle(side) {
  return side === "att" ? "Muscovite Warlord" : "Shield of the North";

function performanceTitle(moveCount) {
  if (moveCount == null) return null;

// Returns a short status string for the caller to show inline (empty
// string means the native share sheet handled it, nothing more to say).
async function shareVictory({ side, statLine, badgeLine }) {
  const blob = await generateShareCardBlob({ side, statLine });
  const fileName = "hnefatafl-victory.png";
  const shareText = buildShareText({
    gameName: "Hnefatafl",
    statLine,
    badgeLine,
    ctaLine: "Wanna give it a try?",
    url: SHARE_URL_WITH_INVITE,
  });

  try {
    const file = new File([blob], fileName, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Hnefatafl — Victory", text: shareText });
      return "";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return ""; // user closed the share sheet — not an error
  }
  try {
    if (navigator.share) {
      await navigator.share({ title: "Hnefatafl — Victory", text: shareText });
      return "";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return "";
  }

  // Fallback for browsers with no Web Share API at all (mainly desktop)
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  try {
    await navigator.clipboard.writeText(shareText);
    return "Image saved + message copied!";
  } catch (e) {
    return "Image saved!";
  }
}

}
const DiagramCaption = ({ t, children }) => (
  <div style={{ fontSize: 11, color: t.muted, textAlign: "center", marginTop: 6, lineHeight: 1.4, maxWidth: 140 }}>{children}</div>
);

// Shared 3x3 grid renderer — every capture diagram below is the same shape:
// the piece being captured sits in the centre, and only the 4 orthogonal
// neighbours are ever relevant. Keeping all three examples on this identical
// grid (rather than a different layout per rule) is what makes "captures
// only happen in a straight line, never diagonally" visually obvious —
// the untouched diagonal corners are doing that work in every diagram.
function Grid3x3({ t, cells }) {
  return (
    <div style={{ display: "inline-flex", flexDirection: "column", gap: 3 }}>
      {cells.map((row, i) => (
        <div key={i} style={{ display: "flex", gap: 3 }}>
          {row.map((cell, j) => <MiniCell key={j} t={t} {...cell} />)}
        </div>
      ))}
    </div>
  );
}

// Two capture examples on the identical grid: a standard two-piece sandwich,
// and a single piece using a hostile corner/throne as its "second piece" —
// per resolveCaptures() above, a restricted square is just as hostile as an
// enemy piece for this purpose.
function CaptureDiagram({ t }) {
  const twoPieceCells = [
    [{}, {}, {}],
    [{ piece: "att", ring: true }, { piece: "def", dim: true }, { piece: "att", ring: true }],
    [{}, {}, {}],
  ];
  const hostileSquareCells = [
    [{}, { restricted: true, cornerGlyph: true, ring: true }, {}],
    [{}, { piece: "def", dim: true }, {}],
    [{}, { piece: "att", ring: true }, {}],
  ];
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 20, justifyContent: "center", marginTop: 8 }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
        <Grid3x3 t={t} cells={twoPieceCells} />
        <DiagramCaption t={t}>Two Muscovites, directly in line — never diagonally.</DiagramCaption>
      </div>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
        <Grid3x3 t={t} cells={hostileSquareCells} />
        <DiagramCaption t={t}>A corner or the empty throne counts as the second piece — one Muscovite is enough.</DiagramCaption>
      </div>
    </div>
  );
}

// King-capture example — the one diagram that actually changes shape
// between variants, since strong-king and weak-king are genuinely
// different mechanics (checkKingCaptured / checkKingCapturedWeak above),
// not just a different label on the same rule.
function KingCaptureDiagram({ t, variant }) {
  const strongCells = [
    [{}, { piece: "att", ring: true }, {}],
    [{ piece: "att", ring: true }, { piece: "king" }, { piece: "att", ring: true }],
    [{}, { piece: "att", ring: true }, {}],
  ];
  const weakCells = [
    [{}, {}, {}],
    [{ piece: "att", ring: true }, { piece: "king" }, { piece: "att", ring: true }],
    [{}, {}, {}],
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginTop: 8 }}>
      <Grid3x3 t={t} cells={variant.kingStrength === "weak" ? weakCells : strongCells} />
      <DiagramCaption t={t}>
        {variant.kingStrength === "weak"
          ? "Captured exactly like an ordinary piece — two hostile squares on one straight line. A corner or the empty throne can stand in for one attacker here too."
          : "Boxed in on all 4 sides — Muscovites win. Throne/corners count the same as an attacker here."}
      </DiagramCaption>
    </div>
  );
}

// Quick-reference rules modal — plain-language summary of the exact logic in
// legalDestinations / resolveCaptures / checkKingCaptured above, kept in sync
// with that code rather than a generic description of "Hnefatafl rules" in
// the abstract (board size, last-stand exception, etc. are all specific
// choices this implementation makes).
function HowToPlayModal({ t, onClose, variant }) {
  const Section = ({ title, children }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1.5, color: t.accent, textTransform: "uppercase", marginBottom: 6 }}>
        {title}
      </div>
      <div style={{ fontSize: 14, lineHeight: 1.65, color: t.text }}>{children}</div>

  const escapeWord = variant.escape === "edge" ? "edge square" : "corner";
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 2500,
        background: "rgba(0,0,0,0.6)",
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: 16,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: t.bg, border: `1px solid ${t.panelBorder}`, borderRadius: 14,
          maxWidth: 460, width: "100%", maxHeight: "82vh", overflowY: "auto",
          padding: "22px 22px 20px", boxShadow: "0 20px 60px rgba(0,0,0,0.5)",
          position: "relative",
        }}
      >
        <button
          onClick={onClose}
          aria-label="Close"
          style={{
            position: "absolute", top: 14, right: 14, width: 28, height: 28, borderRadius: 999,
            border: `1px solid ${t.panelBorder}`, background: t.panel, color: t.muted,
            fontSize: 15, lineHeight: "26px", cursor: "pointer", padding: 0,
          }}
        >
          ✕
        </button>

        <div style={{ fontSize: 11, letterSpacing: 3, color: t.muted, fontWeight: 700, marginBottom: 4 }}>
          QUICK REFERENCE
        </div>
        <h2 style={{ fontSize: 20, fontWeight: 800, margin: "0 0 4px", textTransform: "uppercase", letterSpacing: 0.5 }}>
          How to Play
        </h2>
        <div style={{
          display: "inline-block", fontSize: 11, fontWeight: 700, color: t.accent,
          background: t.accentSoft, border: `1px solid ${t.panelBorder}`, borderRadius: 999,
          padding: "3px 10px", marginBottom: 16,
        }}>
          Ruleset: {variant.name} · {variant.subtitle}
        </div>

        <Section title="The Sides">
          <strong>Swedes</strong> (teal) defend the King, who starts on the throne at the centre of the board.{" "}
          <strong>Muscovites</strong> (gold) surround the board on all four edges and attack. Muscovites always move first.
        </Section>

        <Section title="Movement">
          Every piece moves like a rook — any number of empty squares, straight up, down, left, or right. No diagonals, and no jumping over other pieces.
          {variant.movement === "kingSingleStep" && (
            <> In this ruleset the <strong>King moves only one square at a time</strong> — everyone else still slides freely.</>
          )}
        </Section>

        <Section title="The Throne & Corners">
          The centre throne and the four corners are restricted squares. Only the King may ever land on them — everyone else can pass over the empty throne but can't stop there or on a corner.
        </Section>

        <Section title="Capturing">
          Sandwich an enemy piece between two of your own — or between one of your pieces and a hostile restricted square (empty throne or a corner) — and it's captured. You must move into position to close the trap; walking into a sandwich yourself is always safe.
          <CaptureDiagram t={t} />
        </Section>

        <Section title="The King">
          {variant.kingArmed
            ? "The King fights alongside his Swedes and can act as one side of a sandwich against a Muscovite. "
            : "The King cannot capture Muscovites himself — but he can still be used as the anchor when a Swede closes a trap next to him. "}
          {variant.kingStrength === "weak"
            ? "He's captured exactly like an ordinary piece here — no need to surround all four sides."
            : <>He's captured when surrounded on all 4 sides by attackers and/or hostile squares. The board edge normally shields him — <em>except</em> when he's the very last defender standing, at which point the edge no longer counts as safe either.</>}
          <KingCaptureDiagram t={t} variant={variant} />
        </Section>

        <Section title="Winning">
          Swedes win the instant the King reaches any {escapeWord}. Muscovites win by capturing the King.
        </Section>
      </div>
    </div>

}

function Hnefatafl() {
  const [themeKey, setThemeKey] = useState("dark");
  const t = THEMES[themeKey];
  const [showIntro, setShowIntro] = useState(() => {
    try { return localStorage.getItem(INTRO_SEEN_KEY) !== "1"; } catch (e) { return true; }
  });
  const [showHowTo, setShowHowTo] = useState(false);
  function dismissIntro() {
    try { localStorage.setItem(INTRO_SEEN_KEY, "1"); } catch (e) { /* ignore */ }
    setShowIntro(false);
  }

  // ---------- Rule variant ----------
  // One global "house rules" setting, shared by Play and Challenge (the
  // rules of the game aren't really a per-mode thing). Changing it mid-game
  // resets whichever mode is currently open, via resetPlay/resetChallenge
  // below — the OTHER mode's saved-but-not-open game is left alone and will
  // just pick up the new variant next time it's opened. That's a known,
  // deliberate simplification rather than an oversight: fully quarantining
  // each mode's save to the variant it was started under would mean storing
  // and migrating a variant key per save slot, which isn't worth the
  // complexity for a rules-flavour toggle.
  const [ruleVariantKey, setRuleVariantKeyState] = useState(() => {
    try {
      const saved = localStorage.getItem(RULE_VARIANT_KEY_STORAGE);
      return saved && RULE_VARIANTS[saved] ? saved : DEFAULT_VARIANT_KEY;
    } catch (e) { return DEFAULT_VARIANT_KEY; }
  });
  const ruleVariant = RULE_VARIANTS[ruleVariantKey];
  function setRuleVariantKey(nextKey) {
    setRuleVariantKeyState(nextKey);
    try { localStorage.setItem(RULE_VARIANT_KEY_STORAGE, nextKey); } catch (e) { /* ignore */ }
    if (mode === "play") reset();
    else challengeReset();
  }

  // ---------- Freemium quota + real purchase flow ----------
  const [isPro, setIsPro] = useState(() => !!loadProRecord());
  const [freemium, setFreemium] = useState(() => loadFreemiumState());
  const [playGateActive, setPlayGateActive] = useState(false);
  const [challengeGateActive, setChallengeGateActive] = useState(false);
  const [onlineGateActive, setOnlineGateActive] = useState(false);
  const [checkoutBusy, setCheckoutBusy] = useState(false);
  const [restoreEmail, setRestoreEmail] = useState("");
  const [restoreStatus, setRestoreStatus] = useState("");
  const [showRestoreForm, setShowRestoreForm] = useState(false);

  async function startCheckout() {
    setCheckoutBusy(true);
    try {
      const res = await fetch(`${WORKER_URL}/create-checkout`, { method: "POST" });
      const data = await res.json();
      if (data.checkoutUrl) {
        window.location.href = data.checkoutUrl;
      } else {
        setCheckoutBusy(false);
      }
    } catch (e) {
      setCheckoutBusy(false);
    }
  }

  async function submitRestoreEmail() {
    if (!restoreEmail.includes("@")) { setRestoreStatus("Enter a valid email."); return; }
    setRestoreStatus("Sending…");
    try {
      await fetch(`${WORKER_URL}/resend-token`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: restoreEmail }),
      });
      setRestoreStatus("If that email has a purchase on file, a code is on its way.");
    } catch (e) {
      setRestoreStatus("Something went wrong — try again.");
    }
  }

  // The other half of restore — actually redeeming a code once it's in
  // hand (from the email above, or from an earlier one). This was missing
  // entirely before: the email flow existed but had nowhere to land.
  const [restoreCode, setRestoreCode] = useState("");
  async function submitRestoreCode() {
    if (!restoreCode.trim()) { setRestoreStatus("Enter the code from your email."); return; }
    setRestoreStatus("Activating…");
    try {
      const deviceId = getOrCreateDeviceId();
      const res = await fetch(`${WORKER_URL}/activate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: restoreCode.trim(), deviceId }),
      });
      if (res.ok) {
        writeProRecord({ token: restoreCode.trim(), deviceId, confirmedAt: Date.now() });
        setIsPro(true);
        setPlayGateActive(false);
        setChallengeGateActive(false);
        setRestoreStatus("Unlocked — enjoy unlimited play!");
      } else {
        const data = await res.json().catch(() => ({}));
        setRestoreStatus(data.error || "That code didn't work — check it and try again.");
      }
    } catch (e) {
      setRestoreStatus("Something went wrong — try again.");
    }
  }

  // Handles the return trip from Stripe Checkout. success_url includes
  // ?token=...&paid=1 — poll /check-status a few times since the webhook
  // that actually flips the token to "paid" can lag a couple of seconds
  // behind the redirect (same webhook-lag pattern as Jumpin' Pin).
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const paid = params.get("paid");
    if (!token || paid !== "1") return;

    let cancelled = false;
    async function pollAndActivate() {
      const deviceId = getOrCreateDeviceId();
      for (let attempt = 0; attempt < 8 && !cancelled; attempt++) {
        try {
          const statusRes = await fetch(`${WORKER_URL}/check-status?token=${token}`);
          const statusData = await statusRes.json();
          if (statusData.status === "paid") {
            const activateRes = await fetch(`${WORKER_URL}/activate`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, deviceId }),
            });
            if (activateRes.ok) {
              writeProRecord({ token, deviceId, confirmedAt: Date.now() });
              setIsPro(true);
              setPlayGateActive(false);
              setChallengeGateActive(false);
            }
            break;
          }
        } catch (e) { /* keep retrying, transient network hiccups are expected */ }
        if (!cancelled) await new Promise((r) => setTimeout(r, 1500));
      }
      window.history.replaceState({}, "", window.location.pathname); // drop the query params so a refresh doesn't re-poll
    }
    pollAndActivate();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function devResetQuota() {
    const fresh = { date: todayLocalKey(), playCount: 0, challengeCount: 0, onlineCount: 0 };
    writeFreemiumState(fresh);
    setFreemium(fresh);
    setPlayGateActive(false);
    setChallengeGateActive(false);
    setOnlineGateActive(false);
  }
  // Dev-only escape hatch, console-accessible instead of an on-screen
  // button. The old version was a plain visible pill any real user could
  // tap to fully bypass the $2 Pro paywall on Play/Challenge/Online —
  // worth catching now rather than after it's been quietly used. To reset
  // your own quota while testing, open DevTools console on the live site
  // and run: __hnefataflDevReset()
  useEffect(() => { window.__hnefataflDevReset = devResetQuota; });

  // ---------- Share / brag card ----------
  const [shareStatus, setShareStatus] = useState("");
  async function handleShareVictory(side, statLine, badgeLine) {
    setShareStatus("Preparing card…");
    try {
      const status = await shareVictory({ side, statLine, badgeLine });
      setShareStatus(status);
      if (status) setTimeout(() => setShareStatus(""), 4000);
    } catch (e) {
      setShareStatus("Couldn't share — try again.");
      setTimeout(() => setShareStatus(""), 4000);
    }
  }

  const PAD = 22, MIN_CELL = 22, MAX_CELL = 42, MAX_BOARD_WIDTH = 500;
  // Total extra width the two rope borders + runic side columns add beyond
  // the raw board div itself (OuterRopeFrame padding + RunicFrame's west/
  // east text columns + BoardFrame padding, each side, doubled). The old
  // formula only ever subtracted the page's own 24px padding and had no
  // idea this chrome existed, so on a narrow phone the whole frame ended
  // up wider than the viewport and got silently clipped by overflow-x:
  // hidden — the actual bug behind the missing east/west borders.
  const FRAME_CHROME = 80;
  const [viewportWidth, setViewportWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 390);
  useEffect(() => {
    const onResize = () => setViewportWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const CELL = useMemo(() => {
    const usableWidth = Math.min(viewportWidth - 24 - FRAME_CHROME, MAX_BOARD_WIDTH);
    const raw = (usableWidth - PAD * 2) / (SIZE - 1);
    return Math.max(MIN_CELL, Math.min(MAX_CELL, raw));
  }, [viewportWidth]);
  const boardSize = (SIZE - 1) * CELL + PAD * 2;

  const initialSave = useMemo(() => loadSave(), []);
  const [board, setBoard] = useState(() => initialSave?.board || initialBoard());
  const [turn, setTurn] = useState(() => initialSave?.turn || "att");
  const [selected, setSelected] = useState(null); // never persisted — just a UI focus, not real progress
  const [lastMove, setLastMove] = useState(() => initialSave?.lastMove || null);
  const [winner, setWinner] = useState(() => initialSave?.winner || null);
  const [message, setMessage] = useState(() => initialSave?.message || "Muscovites move first — tap a dark piece.");
  const [capturePopKey, setCapturePopKey] = useState(0);
  const [capturePopSide, setCapturePopSide] = useState("att");
  const [glow, setGlow] = useState(null);
  const [moveCount, setMoveCount] = useState(() => initialSave?.moveCount || 0);

  // Autosave on every real state change — deliberately excludes transient
  // UI state like `selected` and the capture/glow pop timers.
  useEffect(() => {
    writeSave({ board, turn, winner, message, moveCount, lastMove });
  }, [board, turn, winner, message, moveCount, lastMove]);

  const kingPos = useMemo(() => {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === "king") return { r, c };
    return null;
  }, [board]);

  const attCount = useMemo(() => board.flat().filter((p) => p === "att").length, [board]);
  const defCount = useMemo(() => board.flat().filter((p) => p === "def").length, [board]);

  // ---------- Berserker state ----------
  // Recomputed every time the board changes. `wasLoose` tracks the
  // previous render's state so we only fire the big transition moment
  // once, right when the king actually crosses the threshold — not on
  // every render while he stays loose, and not again if he settles back
  // down and breaks free a second time (that's a fresh moment, fires again).
  const kingLoose = useMemo(() => {
    if (!kingPos) return false;
    return isKingLoose(board, kingPos.r, kingPos.c);
  }, [board, kingPos]);
  const [berserkPopKey, setBerserkPopKey] = useState(0);
  const wasLooseRef = useRef(false);
  useEffect(() => {
    if (kingLoose && !wasLooseRef.current) {
      setBerserkPopKey((k) => k + 1);
    }
    wasLooseRef.current = kingLoose;
  }, [kingLoose]);

  const legalDestSet = useMemo(() => {
    if (!selected) return new Set();
    return new Set(legalDestinations(board, selected.r, selected.c, ruleVariant).map(([r, c]) => key(r, c)));
  }, [selected, board]);

  function triggerGlow(side) {
    setGlow({ side, key: Date.now() });
    setTimeout(() => setGlow(null), 1300);
  }

  function handleClick(r, c) {
    if (winner) return;
    const piece = board[r][c];
    const mySide = turn;
    const pieceBelongsToTurn = piece === mySide || (piece === "king" && mySide === "def");

    if (selected) {
      if (legalDestSet.has(key(r, c))) {
        movePiece(selected.r, selected.c, r, c);
        return;
      }
      if (pieceBelongsToTurn) { setSelected({ r, c }); return; }
      setSelected(null);
      return;
    }
    if (pieceBelongsToTurn) setSelected({ r, c });
  }

  function movePiece(fr, fc, tr, tc) {
    const piece = board[fr][fc];
    const next = board.map((row) => row.slice());
    next[fr][fc] = null;
    next[tr][tc] = piece;

    const side = piece === "king" ? "def" : piece;
    // Whether the king's own move can close a capture is a per-variant
    // setting now (RULE_VARIANTS[key].kingArmed) — see resolveMoveCaptures.
    // He can still be used as the ally/anvil when a regular defender closes
    // a capture against him, in every variant, regardless of that setting.
    const captured = resolveMoveCaptures(next, tr, tc, side, piece, ruleVariant);
    captured.forEach(([r, c]) => { next[r][c] = null; });
    if (captured.length > 0) {
      setCapturePopSide(side);
      setCapturePopKey((k) => k + 1);
      triggerGlow(side);
    }

    setBoard(next);
    setSelected(null);
    setLastMove({ from: { r: fr, c: fc }, to: { r: tr, c: tc } });
    setMoveCount((m) => m + 1);

    if (piece === "king" && isEscapeSquare(tr, tc, ruleVariant)) {
      setWinner("def");
      setMessage(ruleVariant.escape === "edge" ? "The king reaches the edge — defenders win!" : "The king reaches the corner — defenders win!");
      return;
    }
    if (piece === "att") {
      const kp = kingPos;
      // king may have just been captured by this very move
      const newKingPos = (() => {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (next[r][c] === "king") return { r, c };
        return null;
      })();
      const remainingDef = next.flat().filter((p) => p === "def").length;
      const isLastStand = remainingDef === 0; // king is the only defender left on the board
      if (newKingPos && checkKingCaptured(next, newKingPos.r, newKingPos.c, isLastStand, ruleVariant)) {
        setWinner("att");
        setMessage(
          isLastStand && ruleVariant.kingStrength === "strong"
            ? "The king's last stand — surrounded alone, even the edge can't save him. Muscovites win!"
            : "The king is surrounded — attackers win!"
        );
        return;
      }
    }

    const nextTurn = turn === "att" ? "def" : "att";
    setTurn(nextTurn);
    setMessage(
      captured.length > 0
        ? `${side === "att" ? "Muscovites" : "Swedes"} captured ${captured.length} piece${captured.length > 1 ? "s" : ""} — ${nextTurn === "att" ? "Muscovites'" : "Swedes'"} move.`
        : `${nextTurn === "att" ? "Muscovites'" : "Swedes'"} move.`
    );
  }

  // Counts a completed Play game exactly once — fires only when `winner`
  // genuinely transitions from null to set *this session*, not when a
  // finished game is loaded from a save (which would double-count a game
  // that was already tallied at the moment it was actually won).
  const prevPlayWinnerRef = useRef(winner);
  useEffect(() => {
    if (winner && !prevPlayWinnerRef.current) {
      setFreemium((prev) => {
        const next = { ...prev, playCount: prev.playCount + 1 };
        writeFreemiumState(next);
        return next;
      });
    }
    prevPlayWinnerRef.current = winner;
  }, [winner]);

  const reset = useCallback(() => {
    if (!isPro && freemium.playCount >= FREE_GAMES_PER_MODE_PER_DAY) {
      setPlayGateActive(true);
      return;
    }
    clearSave();
    setBoard(initialBoard());
    setTurn("att");
    setSelected(null);
    setLastMove(null);
    setWinner(null);
    setMoveCount(0);
    setMessage("Muscovites move first — tap a dark piece.");
  }, [isPro, freemium.playCount]);

  const [mode, setMode] = useState(() => (getInviteTokenFromUrl() ? "online" : "challenge")); // "play" | "challenge" | "online" — Challenge is the default landing mode, unless an invite link brought you here

  // Pro tone picker — same interaction as Jumpin' Pin: tapping a locked
  // tone shows a brief upsell toast instead of switching, rather than
  // just doing nothing (silent failure reads as broken, not locked).
  const [upsell, setUpsell] = useState(null);
  function selectTheme(key) {
    const theme = THEMES[key];
    if (theme.tier === "pro" && !isPro) {
      setUpsell(theme.name);
      setTimeout(() => setUpsell(null), 2200);
      return;
    }
    setThemeKey(key);
  }

  // ---------- Challenge mode — human vs AI ----------
  // Separate state again, same reasoning as Play/Challenge always having
  // kept independent state: entering Challenge never disturbs an
  // in-progress hotseat Play game and vice versa.
  // humanSide is null until chosen — "let the player choose each game"
  // means every fresh game asks again, rather than defaulting to one side.
  const initialChallengeSave = useMemo(() => loadChallengeSave(), []);
  const [challengeBoard, setChallengeBoard] = useState(() => initialChallengeSave?.board || initialBoard());
  const [challengeTurn, setChallengeTurn] = useState(() => initialChallengeSave?.turn || "att");
  const [challengeSelected, setChallengeSelected] = useState(null);
  const [challengeLastMove, setChallengeLastMove] = useState(() => initialChallengeSave?.lastMove || null);
  const [challengeWinner, setChallengeWinner] = useState(() => initialChallengeSave?.winner || null);
  const [challengeMessage, setChallengeMessage] = useState(() => initialChallengeSave?.message || "");
  const [humanSide, setHumanSide] = useState(() => initialChallengeSave?.humanSide || null);
  const [aiThinking, setAiThinking] = useState(false);
  const [challengeMoveCount, setChallengeMoveCount] = useState(() => initialChallengeSave?.moveCount || 0);

  useEffect(() => {
    if (mode === "challenge") {
      writeChallengeSave({ board: challengeBoard, turn: challengeTurn, winner: challengeWinner, message: challengeMessage, humanSide, lastMove: challengeLastMove, moveCount: challengeMoveCount });
    }
